<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TUC Quest: Festival Edition</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; width:100vw; height:100vh; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; }

#overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.88);
  flex-direction:column; align-items:center; justify-content:center; gap:18px;
  z-index:50; color:#fff;
}
#overlay.show { display:flex; }

.ov-boom {
  font-size:80px; font-weight:900; color:#ff3333;
  text-shadow:0 0 40px rgba(255,50,50,0.9);
  animation:boomPulse 0.6s infinite alternate;
}
@keyframes boomPulse { from{transform:scale(1)} to{transform:scale(1.08)} }

.ov-sub { font-size:22px; color:#a3e635; letter-spacing:0.05em; }

.ov-qr {
  background:#fff; padding:14px; border-radius:14px;
  box-shadow:0 0 50px rgba(163,230,53,0.6);
}

.ov-hint { font-size:15px; color:rgba(255,255,255,0.45); text-align:center; }

#btn-respawn {
  padding:14px 52px; font-size:20px; font-weight:800;
  font-family:'Courier New',monospace; letter-spacing:0.05em;
  background:#a3e635; color:#060f07; border:none; border-radius:999px;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
  box-shadow:0 0 24px rgba(163,230,53,0.5);
}
#btn-respawn:hover { transform:translateY(-2px); box-shadow:0 0 36px rgba(163,230,53,0.8); }

.ov-lives { font-size:16px; color:rgba(255,255,255,0.4); }

#gameover {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.95);
  flex-direction:column; align-items:center; justify-content:center; gap:22px;
  z-index:60; color:#fff;
}
#gameover.show { display:flex; }
.go-title { font-size:100px; font-weight:900; color:#ff2222; letter-spacing:0.04em; }
.go-score { font-size:40px; color:#a3e635; }
.go-hint  { font-size:18px; color:rgba(255,255,255,0.35); }
#btn-restart {
  padding:14px 52px; font-size:22px; font-weight:800;
  font-family:'Courier New',monospace; background:#a3e635; color:#060f07;
  border:none; border-radius:999px; cursor:pointer;
  box-shadow:0 0 24px rgba(163,230,53,0.5);
}
#btn-restart:hover { transform:translateY(-2px); box-shadow:0 0 36px rgba(163,230,53,0.8); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Death overlay -->
<div id="overlay">
  <div class="ov-boom">💥 BOOMED!</div>
  <div class="ov-sub">Scan your TUC Wallet QR to Respawn</div>
  <div class="ov-qr"><div id="qr-code"></div></div>
  <div class="ov-hint">Walk to the glowing START portal after scanning</div>
  <button id="btn-respawn">↺  RESPAWN AT PORTAL</button>
  <div class="ov-lives" id="ov-lives-text"></div>
</div>

<!-- Game over -->
<div id="gameover">
  <div class="go-title">GAME OVER</div>
  <div class="go-score" id="go-score-text"></div>
  <div class="go-hint">All lives lost — great run!</div>
  <button id="btn-restart">▶  PLAY AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ── Constants ──────────────────────────────────────────────
const T      = 40;   // tile px
const COLS   = 48;   // 48×40 = 1920
const ROWS   = 26;   // 26×40 = 1040
const HUD    = 40;   // px for HUD bar
const CW     = COLS * T;          // 1920
const CH     = ROWS * T + HUD;    // 1080

const EMPTY=0, WALL=1, BLOCK=2, PORTAL=3;
const DIRS4 = [[0,-1],[0,1],[-1,0],[1,0]];

const BOMB_FUSE     = 3000;  // ms
const EXP_DURATION  = 550;   // ms
const MOVE_MS       = 175;   // ms between tile steps
const ENEMY_SPAWN   = 8;     // number of enemies
const INV_TIME      = 3000;  // invincibility ms after respawn

// ── Canvas ─────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width  = CW;
canvas.height = CH;
const ctx = canvas.getContext('2d');

function scaleCanvas() {
  const s = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  canvas.style.width  = CW * s + 'px';
  canvas.style.height = CH * s + 'px';
}
scaleCanvas();
window.addEventListener('resize', scaleCanvas);

// ── State ──────────────────────────────────────────────────
let map, player, bombs, explosions, enemies, particles;
let score, portalT, moveTimer, lastBomb, gameOn;
let enemySpawnQueue = [];

// ── Map ────────────────────────────────────────────────────
function initMap() {
  map = [];
  for (let r = 0; r < ROWS; r++) {
    map[r] = [];
    for (let c = 0; c < COLS; c++) {
      if (r===0||r===ROWS-1||c===0||c===COLS-1) { map[r][c]=WALL; continue; }
      if (r%2===0 && c%2===0)                    { map[r][c]=WALL; continue; }
      // safe spawn zone: 3×3 around (1,1)
      if (c<=2 && r<=2)                          { map[r][c]=EMPTY; continue; }
      map[r][c] = Math.random() < 0.62 ? BLOCK : EMPTY;
    }
  }
  map[1][1] = PORTAL;
}

function solid(c,r)  { return c<0||c>=COLS||r<0||r>=ROWS||map[r][c]===WALL||map[r][c]===BLOCK; }
function hasBomb(c,r){ return bombs.some(b=>b.c===c&&b.r===r); }

// ── Player ─────────────────────────────────────────────────
function initPlayer() {
  player = {
    c:1, r:1,
    px: 1*T+T/2, py: HUD+1*T+T/2,
    alive:true, inv:false, invT:0, blinkT:0,
    lives:3, bombSlots:1, usedBombs:0, range:3,
  };
}

// ── Enemies ────────────────────────────────────────────────
function spawnEnemy() {
  const pool = [];
  for (let r=1;r<ROWS-1;r++)
    for (let c=1;c<COLS-1;c++)
      if (map[r][c]===EMPTY && !(c<=4&&r<=4)) pool.push({c,r});
  if (!pool.length) return;
  const s = pool[Math.floor(Math.random()*pool.length)];
  enemies.push({
    c:s.c, r:s.r,
    px:s.c*T+T/2, py:HUD+s.r*T+T/2,
    dir:Math.floor(Math.random()*4),
    t:0, interval:450+Math.random()*350,
    alive:true,
  });
}

function initEnemies() {
  enemies = [];
  for (let i=0;i<ENEMY_SPAWN;i++) spawnEnemy();
}

// ── Bombs ──────────────────────────────────────────────────
function placeBomb() {
  if (!player.alive || player.usedBombs >= player.bombSlots) return;
  if (hasBomb(player.c, player.r)) return;
  bombs.push({ c:player.c, r:player.r, fuse:BOMB_FUSE, range:player.range, pt:0 });
  player.usedBombs++;
}

function detonateBomb(bomb) {
  bombs.splice(bombs.indexOf(bomb),1);
  player.usedBombs = Math.max(0, player.usedBombs-1);

  const cells = [{ c:bomb.c, r:bomb.r, kind:'center' }];

  for (const [dc,dr] of DIRS4) {
    for (let i=1; i<=bomb.range; i++) {
      const nc=bomb.c+dc*i, nr=bomb.r+dr*i;
      if (nc<0||nc>=COLS||nr<0||nr>=ROWS) break;
      if (map[nr][nc]===WALL) break;
      if (map[nr][nc]===BLOCK) {
        map[nr][nc] = EMPTY;
        score += 10;
        spawnParticles(nc,nr,10,'#4a8c54','#a3e635');
        cells.push({ c:nc, r:nr, kind:'tip' });
        break;
      }
      cells.push({ c:nc, r:nr, kind: i===bomb.range?'tip':'arm' });
    }
  }

  explosions.push({ cells, timer:EXP_DURATION });

  // chain reaction
  for (const b of [...bombs]) {
    if (cells.some(x=>x.c===b.c&&x.r===b.r)) b.fuse = 0;
  }
}

// ── Particles ──────────────────────────────────────────────
function spawnParticles(c,r,n,col1,col2) {
  const cx=c*T+T/2, cy=HUD+r*T+T/2;
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    particles.push({
      x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, decay:0.02+Math.random()*0.03,
      sz:3+Math.random()*5, col:Math.random()<0.5?col1:col2,
    });
  }
}

// ── Damage ─────────────────────────────────────────────────
function checkHits() {
  for (const exp of explosions) {
    // player
    if (player.alive && !player.inv) {
      if (exp.cells.some(x=>x.c===player.c&&x.r===player.r)) {
        killPlayer();
      }
    }
    // enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      if (exp.cells.some(x=>x.c===e.c&&x.r===e.r)) {
        e.alive = false;
        score += 100;
        spawnParticles(e.c,e.r,14,'#ff6b35','#ff2222');
        // schedule respawn
        enemySpawnQueue.push(Date.now() + 8000);
      }
    }
  }
}

function killPlayer() {
  if (!player.alive) return;
  spawnParticles(player.c,player.r,18,'#ff4444','#ffaa00');
  player.lives--;
  player.alive = false;
  gameOn = false;
  if (player.lives <= 0) {
    setTimeout(showGameOver, 800);
  } else {
    setTimeout(showDeathOverlay, 600);
  }
}

// ── Overlays ───────────────────────────────────────────────
let qrMade = false;
function showDeathOverlay() {
  document.getElementById('ov-lives-text').textContent =
    `Lives remaining: ${player.lives}`;
  document.getElementById('overlay').classList.add('show');
  if (!qrMade) {
    new QRCode(document.getElementById('qr-code'), {
      text:'https://upcycle-collective.vercel.app/app.html',
      width:200, height:200,
      colorDark:'#000000', colorLight:'#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
    qrMade = true;
  }
}

function hideDeathOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

function respawn() {
  hideDeathOverlay();
  player.c=1; player.r=1;
  player.px=1*T+T/2; player.py=HUD+1*T+T/2;
  player.alive=true; player.inv=true; player.invT=INV_TIME; player.blinkT=0;
  player.usedBombs=0;
  bombs=[]; explosions=[];
  gameOn=true;
}

function showGameOver() {
  document.getElementById('go-score-text').textContent = `Score: ${score}`;
  document.getElementById('gameover').classList.add('show');
}

document.getElementById('btn-respawn').addEventListener('click', respawn);
document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('gameover').classList.remove('show');
  startGame();
});

// ── Input ──────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code==='Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code]=false; });

// ── Update ─────────────────────────────────────────────────
function updatePlayer(dt) {
  if (!player.alive) return;

  if (player.inv) {
    player.invT   -= dt;
    player.blinkT += dt;
    if (player.invT <= 0) { player.inv=false; player.invT=0; }
  }

  moveTimer += dt;
  if (moveTimer >= MOVE_MS) {
    moveTimer = 0;
    let dc=0, dr=0;
    if      (keys['ArrowUp']   ||keys['KeyW']) dr=-1;
    else if (keys['ArrowDown'] ||keys['KeyS']) dr= 1;
    else if (keys['ArrowLeft'] ||keys['KeyA']) dc=-1;
    else if (keys['ArrowRight']||keys['KeyD']) dc= 1;

    if (dc||dr) {
      const nc=player.c+dc, nr=player.r+dr;
      if (!solid(nc,nr) && !hasBomb(nc,nr)) { player.c=nc; player.r=nr; }
    }
  }

  // smooth lerp
  player.px += (player.c*T+T/2 - player.px) * 0.28;
  player.py += (HUD+player.r*T+T/2 - player.py) * 0.28;

  const bombKey = keys['Space']||keys['KeyZ'];
  if (bombKey && !lastBomb) placeBomb();
  lastBomb = bombKey;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.t += dt;
    if (e.t >= e.interval) {
      e.t = 0;
      const shuffled = [...Array(4).keys()].sort(()=>Math.random()-0.5);
      if (Math.random()<0.7) shuffled.unshift(e.dir % 4);
      for (const d of shuffled) {
        const [dc,dr]=DIRS4[d], nc=e.c+dc, nr=e.r+dr;
        if (!solid(nc,nr) && !hasBomb(nc,nr)) {
          e.c=nc; e.r=nr; e.dir=d; break;
        }
      }
    }
    e.px += (e.c*T+T/2 - e.px)*0.2;
    e.py += (HUD+e.r*T+T/2 - e.py)*0.2;
  }

  // queue-based respawn
  const now = Date.now();
  while (enemySpawnQueue.length && enemySpawnQueue[0] <= now) {
    enemySpawnQueue.shift();
    spawnEnemy();
  }
}

function update(dt) {
  if (!gameOn) {
    // still animate particles when dead
    updateParticles(dt);
    return;
  }

  portalT += dt/1000;

  // bombs
  for (const b of [...bombs]) {
    b.fuse -= dt; b.pt += dt;
    if (b.fuse <= 0) detonateBomb(b);
  }

  // explosions
  for (let i=explosions.length-1;i>=0;i--) {
    explosions[i].timer -= dt;
    if (explosions[i].timer<=0) explosions.splice(i,1);
  }

  updatePlayer(dt);
  updateEnemies(dt);
  checkHits();
  updateParticles(dt);
}

function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18;
    p.life-=p.decay;
    if (p.life<=0) particles.splice(i,1);
  }
}

// ── Draw ───────────────────────────────────────────────────
function drawMap() {
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const x=c*T, y=HUD+r*T, tile=map[r][c];

      if (tile===WALL) {
        ctx.fillStyle='#111e13';
        ctx.fillRect(x,y,T,T);
        ctx.fillStyle='#1a2e1c';
        ctx.fillRect(x,y,T,2); ctx.fillRect(x,y,2,T);
        ctx.fillStyle='#0b130c';
        ctx.fillRect(x+2,y+2,T-4,T-4);
      } else {
        ctx.fillStyle=(r+c)%2===0?'#0b1a0e':'#0e1f11';
        ctx.fillRect(x,y,T,T);

        if (tile===BLOCK) {
          ctx.fillStyle='#1b4422';
          ctx.fillRect(x+2,y+2,T-4,T-4);
          ctx.fillStyle='#266030';
          ctx.fillRect(x+2,y+2,T-4,2); ctx.fillRect(x+2,y+2,2,T-4);
          ctx.fillStyle='#122e18';
          ctx.fillRect(x+T-4,y+2,2,T-4); ctx.fillRect(x+2,y+T-4,T-4,2);
          // crack
          ctx.strokeStyle='#0c1e0f'; ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(x+10,y+8); ctx.lineTo(x+16,y+18); ctx.lineTo(x+13,y+28);
          ctx.stroke();
        } else if (tile===PORTAL) {
          const p=Math.sin(portalT*3)*0.3+0.7;
          ctx.shadowColor='#a3e635'; ctx.shadowBlur=22*p;
          const g=ctx.createRadialGradient(x+T/2,y+T/2,2,x+T/2,y+T/2,T/2*p);
          g.addColorStop(0,`rgba(163,230,53,${0.95*p})`);
          g.addColorStop(0.6,`rgba(90,180,20,${0.4*p})`);
          g.addColorStop(1,'rgba(163,230,53,0)');
          ctx.fillStyle=g;
          ctx.fillRect(x,y,T,T);
          ctx.shadowBlur=0;
          ctx.strokeStyle=`rgba(163,230,53,${p})`; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,T/2-4,0,Math.PI*2); ctx.stroke();
          ctx.fillStyle=`rgba(163,230,53,${p})`;
          ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('START',x+T/2,y+T/2);
        }
      }
    }
  }
}

function drawExplosions() {
  for (const exp of explosions) {
    const p = exp.timer / EXP_DURATION;
    for (const cell of exp.cells) {
      const x=cell.c*T, y=HUD+cell.r*T;
      ctx.shadowColor = cell.kind==='center'?'#ffffa0':'#ff9f1c';
      ctx.shadowBlur  = 18*p;

      if (cell.kind==='center') {
        ctx.fillStyle=`rgba(255,248,160,${p})`;
        ctx.fillRect(x,y,T,T);
        ctx.fillStyle=`rgba(255,200,0,${p*0.6})`;
        ctx.fillRect(x+4,y+4,T-8,T-8);
      } else {
        ctx.fillStyle=`rgba(255,159,28,${p*0.9})`;
        ctx.fillRect(x+5,y+5,T-10,T-10);
        ctx.fillStyle=`rgba(255,230,0,${p*0.6})`;
        ctx.fillRect(x+10,y+10,T-20,T-20);
      }
      ctx.shadowBlur=0;
    }
  }
}

function drawBombs() {
  for (const b of bombs) {
    const x=b.c*T+T/2, y=HUD+b.r*T+T/2;
    const prog=b.fuse/BOMB_FUSE;
    const pulse=1+Math.sin(b.pt/180)*0.1*(1+(1-prog)*1.5);
    const rad=T/2*0.72*pulse;

    // shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x+2,y+rad*0.55,rad*0.85,rad*0.3,0,0,Math.PI*2); ctx.fill();

    // body
    ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=6;
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // shine
    ctx.fillStyle='rgba(255,255,255,0.13)';
    ctx.beginPath(); ctx.arc(x-rad*0.32,y-rad*0.32,rad*0.28,0,Math.PI*2); ctx.fill();

    // fuse
    const flicker=Math.random()<0.35;
    ctx.strokeStyle=flicker?'#ffdd00':'#ff6b35'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(x,y-rad);
    ctx.bezierCurveTo(x+rad*0.5,y-rad*1.35,x+rad*0.85,y-rad*1.55,x+rad*0.65,y-rad*1.85);
    ctx.stroke();
    if (!flicker) {
      ctx.shadowColor='#ffdd00'; ctx.shadowBlur=8;
      ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(x+rad*0.65,y-rad*1.85,3.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }

    // countdown ring
    ctx.strokeStyle=`hsl(${100*prog},100%,50%)`; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(x,y,rad+4,-Math.PI/2,-Math.PI/2+Math.PI*2*prog); ctx.stroke();
  }
}

function drawPlayer() {
  if (!player.alive) return;
  if (player.inv && Math.floor(player.blinkT/100)%2===0) return;

  const x=player.px, y=player.py, r=T/2*0.75;

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x+2,y+r*0.6,r*0.8,r*0.3,0,0,Math.PI*2); ctx.fill();

  // glow
  ctx.shadowColor='#a3e635'; ctx.shadowBlur=12;

  // body
  ctx.fillStyle='#a3e635';
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();

  // helmet top
  ctx.fillStyle='#7cb82a';
  ctx.beginPath(); ctx.arc(x,y-r*0.05,r*0.85,Math.PI,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // eyes
  ctx.fillStyle='#0a1a0d';
  ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.15,r*0.15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.3,y-r*0.15,r*0.15,0,Math.PI*2); ctx.fill();

  // smile
  ctx.strokeStyle='#0a1a0d'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y+r*0.12,r*0.3,0.2,Math.PI-0.2); ctx.stroke();
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const x=e.px, y=e.py, r=T/2*0.7;

    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x+2,y+r*0.6,r*0.8,r*0.3,0,0,Math.PI*2); ctx.fill();

    ctx.shadowColor='#e74c3c'; ctx.shadowBlur=10;
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#962d22'; ctx.beginPath(); ctx.arc(x,y-r*0.05,r*0.85,Math.PI,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.15,r*0.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+r*0.3,y-r*0.15,r*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.15,r*0.09,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+r*0.3,y-r*0.15,r*0.09,0,Math.PI*2); ctx.fill();

    // angry brows
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x-r*0.5,y-r*0.35); ctx.lineTo(x-r*0.1,y-r*0.28);
    ctx.moveTo(x+r*0.5,y-r*0.35); ctx.lineTo(x+r*0.1,y-r*0.28);
    ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawHUD() {
  ctx.fillStyle='#050e07'; ctx.fillRect(0,0,CW,HUD);
  ctx.fillStyle='#1e3a22'; ctx.fillRect(0,HUD-1,CW,1);

  // logo
  ctx.shadowColor='#a3e635'; ctx.shadowBlur=8;
  ctx.fillStyle='#a3e635'; ctx.font='bold 16px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('⬡ TUC QUEST: FESTIVAL EDITION', 16, HUD/2);
  ctx.shadowBlur=0;

  // lives
  ctx.fillStyle='#3a6040'; ctx.font='10px monospace';
  ctx.textAlign='center';
  ctx.fillText('LIVES', CW/2-50, HUD/2-8);
  ctx.fillStyle=player.inv?'rgba(163,230,53,0.4)':'#a3e635';
  ctx.font='bold 18px monospace';
  let hstr='';
  for (let i=0;i<player.lives;i++) hstr+='♥ ';
  for (let i=player.lives;i<3;i++) hstr+='♡ ';
  ctx.fillText(hstr.trim(), CW/2-50, HUD/2+7);

  // score
  ctx.fillStyle='#3a6040'; ctx.font='10px monospace';
  ctx.textAlign='right';
  ctx.fillText('SCORE', CW-16, HUD/2-8);
  ctx.fillStyle='#fff'; ctx.font='bold 20px monospace';
  ctx.fillText(String(score).padStart(6,'0'), CW-16, HUD/2+7);

  // controls
  ctx.fillStyle='#2a4a30'; ctx.font='11px monospace';
  ctx.textAlign='center';
  ctx.fillText('WASD / ↑↓←→  MOVE     SPACE  BOMB', CW/2+70, HUD/2);
}

// ── Loop ───────────────────────────────────────────────────
let last=0;
function loop(ts) {
  const dt = Math.min(ts-last, 50);
  last = ts;
  update(dt);

  ctx.fillStyle='#0a1a0d'; ctx.fillRect(0,0,CW,CH);
  drawMap();
  drawExplosions();
  drawBombs();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawHUD();

  requestAnimationFrame(loop);
}

// ── Start ──────────────────────────────────────────────────
function startGame() {
  score=0; portalT=0; moveTimer=0; lastBomb=false; gameOn=true;
  bombs=[]; explosions=[]; particles=[]; enemySpawnQueue=[];
  initMap();
  initPlayer();
  initEnemies();
}

startGame();
requestAnimationFrame(loop);
</script>
