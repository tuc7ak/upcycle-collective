<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TUC Quest: Festival Edition 🎮</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:linear-gradient(160deg,#1a5cc8,#0e3a8a);
  display:flex; align-items:center; justify-content:center;
  width:100vw; height:100vh; overflow:hidden;
  font-family:'Courier New',monospace;
}
canvas { display:block; border-radius:4px; }

/* ── Death overlay ── */
#overlay {
  display:none; position:fixed; inset:0;
  background:rgba(10,0,30,0.86);
  flex-direction:column; align-items:center; justify-content:center; gap:16px;
  z-index:50; color:#fff;
}
#overlay.show { display:flex; }
.ov-boom {
  font-size:84px; font-weight:900; color:#ff4400;
  text-shadow:0 0 30px #ff8800, 0 0 70px #ff3300;
  animation:boomPulse .5s infinite alternate;
}
@keyframes boomPulse { from{transform:scale(1)rotate(-2deg)} to{transform:scale(1.1)rotate(2deg)} }
.ov-sub { font-size:22px; color:#ffdd00; font-weight:800; letter-spacing:0.08em; }
.ov-qr { background:#fff; padding:14px; border-radius:16px; box-shadow:0 0 60px rgba(255,220,0,0.7); }
.ov-hint { font-size:15px; color:rgba(255,255,255,0.45); }
#btn-respawn {
  padding:14px 52px; font-size:20px; font-weight:900; letter-spacing:0.06em;
  font-family:'Courier New',monospace;
  background:linear-gradient(135deg,#ffee00,#ff8800); color:#1a0600; border:none;
  border-radius:999px; cursor:pointer;
  box-shadow:0 5px 0 #aa4400, 0 0 30px rgba(255,180,0,0.6);
  transition:transform .1s, box-shadow .1s;
}
#btn-respawn:active { transform:translateY(3px); box-shadow:0 2px 0 #aa4400; }
.ov-lives { font-size:15px; color:rgba(255,255,255,0.38); }

/* ── Game over ── */
#gameover {
  display:none; position:fixed; inset:0;
  background:rgba(5,0,20,0.96);
  flex-direction:column; align-items:center; justify-content:center; gap:20px;
  z-index:60; color:#fff;
}
#gameover.show { display:flex; }
.go-title { font-size:100px; font-weight:900; color:#ff2222; text-shadow:0 0 40px #ff0000; }
.go-score { font-size:44px; color:#ffdd00; font-weight:800; }
.go-hint  { font-size:17px; color:rgba(255,255,255,0.3); }
#btn-restart {
  padding:14px 52px; font-size:22px; font-weight:900; letter-spacing:0.06em;
  font-family:'Courier New',monospace;
  background:linear-gradient(135deg,#44ff88,#00cc44); color:#001800; border:none;
  border-radius:999px; cursor:pointer;
  box-shadow:0 5px 0 #006622, 0 0 30px rgba(0,255,100,0.4);
}
#btn-restart:active { transform:translateY(3px); }

/* ── Main menu ── */
#main-menu {
  display:flex; position:fixed; inset:0; z-index:100;
  flex-direction:column; align-items:center; justify-content:center; gap:28px;
  background:linear-gradient(160deg,#0d1a4a 0%,#1a0a3a 100%);
}
.mm-stars { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.mm-logo  { font-size:72px; filter:drop-shadow(0 0 24px rgba(163,230,53,0.8)); }
.mm-title {
  font-size:56px; font-weight:900; color:#fff; letter-spacing:0.06em;
  text-shadow:0 0 30px rgba(100,200,255,0.6);
}
.mm-sub { font-size:20px; color:rgba(255,255,255,0.45); letter-spacing:0.15em; margin-top:-18px; }
.mm-btn {
  width:420px; padding:20px 40px; font-size:22px; font-weight:900;
  font-family:'Courier New',monospace; letter-spacing:0.06em;
  border:none; border-radius:16px; cursor:pointer;
  transition:transform .12s, box-shadow .12s;
  display:flex; align-items:center; justify-content:center; gap:14px;
}
.mm-btn:hover { transform:translateY(-3px) scale(1.02); }
.mm-btn:active { transform:translateY(2px) scale(0.98); }
#mm-bomb {
  background:linear-gradient(135deg,#44aaff,#1155dd);
  color:#fff;
  box-shadow:0 6px 0 #0033aa, 0 0 32px rgba(80,150,255,0.5);
}
#mm-kahoot {
  background:linear-gradient(135deg,#cc44ff,#8811dd);
  color:#fff;
  box-shadow:0 6px 0 #550088, 0 0 32px rgba(180,80,255,0.5);
}
#mm-hunt {
  background:linear-gradient(135deg,#a3e635,#22c55e);
  color:#060f08;
  box-shadow:0 6px 0 #166534, 0 0 32px rgba(163,230,53,0.5);
}
.mm-version { font-size:12px; color:rgba(255,255,255,0.2); letter-spacing:0.1em; }

/* ── Analog stick (bottom-left) ── */
#stick-label {
  position:fixed; bottom:198px; left:28px; z-index:40;
  color:rgba(180,200,255,0.65); font-size:12px; font-weight:700;
  letter-spacing:0.12em; text-align:center; width:150px;
}
#joystick-base {
  position:fixed; bottom:28px; left:28px; z-index:40;
  width:150px; height:150px; border-radius:50%;
  background:rgba(30,70,190,0.38);
  border:3px solid rgba(130,175,255,0.65);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px rgba(60,110,255,0.3), inset 0 0 30px rgba(0,0,50,0.25);
  cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
  /* crosshair guides */
  overflow:hidden;
}
#joystick-base::before, #joystick-base::after {
  content:''; position:absolute;
  background:rgba(150,190,255,0.18);
}
#joystick-base::before { width:100%; height:2px; top:50%; left:0; transform:translateY(-50%); }
#joystick-base::after  { width:2px; height:100%; top:0; left:50%; transform:translateX(-50%); }
#joystick-knob {
  position:absolute; width:58px; height:58px; border-radius:50%;
  background:radial-gradient(circle at 34% 32%, rgba(160,200,255,0.95), rgba(50,90,220,0.92));
  border:3px solid rgba(190,220,255,0.9);
  box-shadow:0 0 18px rgba(100,160,255,0.7), 0 4px 8px rgba(0,0,0,0.45);
  top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none;
}

/* ── Bomb button (bottom-right) ── */
#bomb-wrap {
  position:fixed; bottom:28px; right:28px; z-index:40;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  user-select:none; -webkit-user-select:none;
}
#btn-bomb {
  width:110px; height:110px;
  background:radial-gradient(circle at 35% 32%, #ff8888, #dd1111 55%, #880000);
  border:4px solid rgba(255,160,160,0.9);
  border-radius:50%; font-size:48px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 7px 0 #550000, 0 0 36px rgba(255,50,50,0.55);
  touch-action:none;
  transition:transform .08s, box-shadow .08s;
  border-bottom-width:7px;
}
#btn-bomb:active, #btn-bomb.pressed {
  transform:translateY(4px);
  box-shadow:0 3px 0 #550000, 0 0 20px rgba(255,50,50,0.4);
  border-bottom-width:4px;
}
#bomb-label {
  color:rgba(255,180,180,0.75); font-size:13px; font-weight:700; letter-spacing:0.12em;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Main menu -->
<div id="main-menu">
  <div class="mm-stars" id="mm-stars"></div>
  <div class="mm-logo">♻️</div>
  <div class="mm-title">TUC QUEST</div>
  <div class="mm-sub">FESTIVAL EDITION</div>
  <button class="mm-btn" id="mm-bomb">💣&nbsp; Bomberman Version</button>
  <button class="mm-btn" id="mm-kahoot">🎯&nbsp; Kahoot Version</button>
  <button class="mm-btn" id="mm-hunt">🗺️&nbsp; Treasure Hunt</button>
  <div class="mm-version">THE UPCYCLE COLLECTIVE · KUCHING 2026</div>
</div>

<!-- Death overlay -->
<div id="overlay">
  <div class="ov-boom">💥 BOOMED!</div>
  <div class="ov-sub">⚡ Scan TUC Wallet QR to Respawn ⚡</div>
  <div class="ov-qr"><div id="qr-code"></div></div>
  <div class="ov-hint">Return to the glowing START portal to continue your quest!</div>
  <button id="btn-respawn">✨  RESPAWN AT PORTAL  ✨</button>
  <div class="ov-lives" id="ov-lives-text"></div>
</div>

<!-- Game over -->
<div id="gameover">
  <div class="go-title">GAME OVER</div>
  <div class="go-score" id="go-score-text"></div>
  <div class="go-hint">All lives lost — what an adventure!</div>
  <button id="btn-restart">▶  PLAY AGAIN</button>
</div>

<!-- Analog stick (bottom-left) -->
<div id="stick-label">MOVE</div>
<div id="joystick-base">
  <div id="joystick-knob"></div>
</div>

<!-- Bomb button (bottom-right) -->
<div id="bomb-wrap">
  <div id="bomb-label">BOMB</div>
  <button id="btn-bomb" tabindex="-1">💣</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ── Constants ──────────────────────────────────────────────
const T    = 40;
const COLS = 48;   // 48×40 = 1920
const ROWS = 26;   // 26×40 = 1040
const HUD  = 40;
const CW   = COLS * T;       // 1920
const CH   = ROWS * T + HUD; // 1080

const EMPTY=0, WALL=1, BLOCK=2, PORTAL=3;
const DIRS4 = [[0,-1],[0,1],[-1,0],[1,0]];

const BOMB_FUSE    = 3000;
const EXP_DURATION = 600;
const MOVE_MS      = 130;
const ENEMY_COUNT  = 10;
const INV_TIME     = 3000;

// ── Canvas ─────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width = CW; canvas.height = CH;
const ctx = canvas.getContext('2d');

function scaleCanvas() {
  const s = Math.min(window.innerWidth/CW, window.innerHeight/CH);
  canvas.style.width  = CW*s+'px';
  canvas.style.height = CH*s+'px';
}
scaleCanvas();
window.addEventListener('resize', scaleCanvas);

// ── State ──────────────────────────────────────────────────
let map, player, bombs, explosions, enemies, particles, popups;
let score, portalT, moveTimer, lastBomb, gameOn, enemySpawnQueue;

// ── Map ────────────────────────────────────────────────────
function initMap() {
  map = [];
  for (let r=0;r<ROWS;r++) {
    map[r]=[];
    for (let c=0;c<COLS;c++) {
      if (r===0||r===ROWS-1||c===0||c===COLS-1) { map[r][c]=WALL; continue; }
      if (r%2===0 && c%2===0)                    { map[r][c]=WALL; continue; }
      if (c<=2 && r<=2)                          { map[r][c]=EMPTY; continue; }
      map[r][c] = Math.random()<0.62 ? BLOCK : EMPTY;
    }
  }
  map[1][1] = PORTAL;
}

function solid(c,r)   { return c<0||c>=COLS||r<0||r>=ROWS||map[r][c]===WALL||map[r][c]===BLOCK; }
function hasBomb(c,r) { return bombs.some(b=>b.c===c&&b.r===r); }

// ── Player ─────────────────────────────────────────────────
function initPlayer() {
  player = {
    c:1, r:1, px:1*T+T/2, py:HUD+1*T+T/2,
    alive:true, inv:false, invT:0, blinkT:0,
    lives:3, bombSlots:1, usedBombs:0, range:3,
  };
}

// ── Enemies ────────────────────────────────────────────────
function spawnEnemy() {
  const pool=[];
  for (let r=1;r<ROWS-1;r++)
    for (let c=1;c<COLS-1;c++)
      if (map[r][c]===EMPTY && !(c<=5&&r<=5)) pool.push({c,r});
  if (!pool.length) return;
  const s=pool[Math.floor(Math.random()*pool.length)];
  enemies.push({
    c:s.c, r:s.r, px:s.c*T+T/2, py:HUD+s.r*T+T/2,
    dir:Math.floor(Math.random()*4),
    t:0, interval:420+Math.random()*360,
    alive:true, wobble:Math.random()*Math.PI*2,
  });
}

function initEnemies() {
  enemies=[];
  for (let i=0;i<ENEMY_COUNT;i++) spawnEnemy();
}

// ── Bombs ──────────────────────────────────────────────────
function placeBomb() {
  if (!player.alive||player.usedBombs>=player.bombSlots) return;
  if (hasBomb(player.c,player.r)) return;
  bombs.push({c:player.c,r:player.r,fuse:BOMB_FUSE,range:player.range,pt:0});
  player.usedBombs++;
}

function detonateBomb(bomb) {
  bombs.splice(bombs.indexOf(bomb),1);
  player.usedBombs=Math.max(0,player.usedBombs-1);
  const cells=[{c:bomb.c,r:bomb.r,kind:'center'}];
  for (const [dc,dr] of DIRS4) {
    for (let i=1;i<=bomb.range;i++) {
      const nc=bomb.c+dc*i, nr=bomb.r+dr*i;
      if (nc<0||nc>=COLS||nr<0||nr>=ROWS) break;
      if (map[nr][nc]===WALL) break;
      if (map[nr][nc]===BLOCK) {
        map[nr][nc]=EMPTY;
        score+=10;
        addPopup(nc*T+T/2, HUD+nr*T, '+10', '#ffee44');
        spawnParticles(nc,nr,10,'#ffaa22','#ff6600');
        cells.push({c:nc,r:nr,kind:'tip'});
        break;
      }
      cells.push({c:nc,r:nr,kind:i===bomb.range?'tip':'arm'});
    }
  }
  explosions.push({cells,timer:EXP_DURATION});
  for (const b of [...bombs])
    if (cells.some(x=>x.c===b.c&&x.r===b.r)) b.fuse=0;
}

// ── Particles ──────────────────────────────────────────────
function spawnParticles(c,r,n,c1,c2) {
  const cx=c*T+T/2, cy=HUD+r*T+T/2;
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*6;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1, decay:0.02+Math.random()*0.03,
      sz:3+Math.random()*6, col:Math.random()<0.5?c1:c2});
  }
}

// ── Score popups ───────────────────────────────────────────
function addPopup(x,y,text,col) {
  popups.push({x,y,text,col,life:1,vy:-1.8});
}

// ── Damage ─────────────────────────────────────────────────
function checkHits() {
  for (const exp of explosions) {
    if (player.alive&&!player.inv)
      if (exp.cells.some(x=>x.c===player.c&&x.r===player.r)) killPlayer();
    for (const e of enemies) {
      if (!e.alive) continue;
      if (exp.cells.some(x=>x.c===e.c&&x.r===e.r)) {
        e.alive=false; score+=100;
        addPopup(e.px, e.py, '+100', '#ff4400');
        spawnParticles(e.c,e.r,16,'#ff6622','#ffcc00');
        enemySpawnQueue.push(Date.now()+8000);
      }
    }
  }
}

function killPlayer() {
  if (!player.alive) return;
  spawnParticles(player.c,player.r,20,'#ff3366','#ffaa00');
  player.lives--;
  player.alive=false; gameOn=false;
  if (player.lives<=0) setTimeout(showGameOver,800);
  else setTimeout(showDeathOverlay,600);
}

// ── Overlays ───────────────────────────────────────────────
let qrMade=false;
function showDeathOverlay() {
  document.getElementById('ov-lives-text').textContent=`Lives remaining: ${player.lives}`;
  document.getElementById('overlay').classList.add('show');
  if (!qrMade) {
    new QRCode(document.getElementById('qr-code'),{
      text:'https://upcycle-collective.vercel.app/app.html',
      width:200,height:200,colorDark:'#000',colorLight:'#fff',
      correctLevel:QRCode.CorrectLevel.M,
    });
    qrMade=true;
  }
}
function showGameOver() {
  document.getElementById('go-score-text').textContent=`Score: ${score}`;
  document.getElementById('gameover').classList.add('show');
}
function respawn() {
  document.getElementById('overlay').classList.remove('show');
  player.c=1;player.r=1;player.px=1*T+T/2;player.py=HUD+1*T+T/2;
  player.alive=true;player.inv=true;player.invT=INV_TIME;player.blinkT=0;
  player.usedBombs=0; bombs=[]; explosions=[]; gameOn=true;
}

document.getElementById('btn-respawn').addEventListener('click',respawn);
document.getElementById('btn-restart').addEventListener('click',()=>{
  document.getElementById('gameover').classList.remove('show');
  startGame();
});

// ── Keyboard input ─────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup',  e=>{ keys[e.code]=false; });

// ── Analog joystick ────────────────────────────────────────
const jBase  = document.getElementById('joystick-base');
const jKnob  = document.getElementById('joystick-knob');
const J_RADIUS  = 75;   // half of base width
const J_DEAD    = 0.22; // dead-zone fraction
let jActive = false, jOriginX = 0, jOriginY = 0;

function jClear() {
  jActive = false;
  keys['ArrowUp']=keys['ArrowDown']=keys['ArrowLeft']=keys['ArrowRight']=false;
  jKnob.style.left = '50%';
  jKnob.style.top  = '50%';
}

function jMove(cx, cy) {
  if (!jActive) return;
  const dx = cx - jOriginX, dy = cy - jOriginY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const angle = Math.atan2(dy, dx);
  const clamp = Math.min(dist, J_RADIUS);
  // move knob
  jKnob.style.left = `calc(50% + ${Math.cos(angle)*clamp}px)`;
  jKnob.style.top  = `calc(50% + ${Math.sin(angle)*clamp}px)`;
  // set direction
  keys['ArrowUp']=keys['ArrowDown']=keys['ArrowLeft']=keys['ArrowRight']=false;
  if (dist > J_RADIUS * J_DEAD) {
    const deg = angle * 180 / Math.PI;
    if      (deg > -135 && deg <= -45)  keys['ArrowUp']    = true;
    else if (deg > -45  && deg <= 45)   keys['ArrowRight'] = true;
    else if (deg > 45   && deg <= 135)  keys['ArrowDown']  = true;
    else                                keys['ArrowLeft']  = true;
  }
}

function jStart(cx, cy) {
  const rect = jBase.getBoundingClientRect();
  jOriginX = rect.left + rect.width/2;
  jOriginY = rect.top  + rect.height/2;
  jActive = true;
  jMove(cx, cy);
}

// Pointer Events: lower latency than mouse/touch, works on all devices
// setPointerCapture ensures moves are tracked even outside the element
jBase.addEventListener('pointerdown', e => {
  jBase.setPointerCapture(e.pointerId);
  jStart(e.clientX, e.clientY);
  e.preventDefault();
}, {passive:false});
jBase.addEventListener('pointermove', e => {
  if (jActive) jMove(e.clientX, e.clientY);
}, {passive:false});
jBase.addEventListener('pointerup',     () => jClear());
jBase.addEventListener('pointercancel', () => jClear());

// ── Bomb button ────────────────────────────────────────────
function bindBtn(id, code) {
  const el = document.getElementById(id);
  const on  = e => { keys[code]=true;  e.preventDefault(); };
  const off = e => { keys[code]=false; e.preventDefault(); };
  el.addEventListener('mousedown',  on,  {passive:false});
  el.addEventListener('mouseup',    off, {passive:false});
  el.addEventListener('mouseleave', off, {passive:false});
  el.addEventListener('touchstart', on,  {passive:false});
  el.addEventListener('touchend',   off, {passive:false});
  el.addEventListener('touchcancel',off, {passive:false});
}
bindBtn('btn-bomb', 'Space');

// ── Update ─────────────────────────────────────────────────
function updatePlayer(dt) {
  if (!player.alive) return;
  if (player.inv) {
    player.invT-=dt; player.blinkT+=dt;
    if (player.invT<=0) { player.inv=false; player.invT=0; }
  }
  let dc=0,dr=0;
  if      (keys['ArrowUp']   ||keys['KeyW']) dr=-1;
  else if (keys['ArrowDown'] ||keys['KeyS']) dr= 1;
  else if (keys['ArrowLeft'] ||keys['KeyA']) dc=-1;
  else if (keys['ArrowRight']||keys['KeyD']) dc= 1;

  // Fire immediately on a new direction press instead of waiting for the timer
  if ((dc||dr) && (dc!==player.lastDc||dr!==player.lastDr)) moveTimer=MOVE_MS;
  player.lastDc=dc; player.lastDr=dr;

  moveTimer+=dt;
  if (moveTimer>=MOVE_MS) {
    moveTimer=0;
    if (dc||dr) {
      const nc=player.c+dc,nr=player.r+dr;
      if (!solid(nc,nr)&&!hasBomb(nc,nr)) { player.c=nc; player.r=nr; }
    }
  }
  player.px+=(player.c*T+T/2-player.px)*0.42;
  player.py+=(HUD+player.r*T+T/2-player.py)*0.42;
  const bk=keys['Space']||keys['KeyZ'];
  if (bk&&!lastBomb) placeBomb();
  lastBomb=bk;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.t+=dt; e.wobble+=dt*0.004;
    if (e.t>=e.interval) {
      e.t=0;
      const sh=[...Array(4).keys()].sort(()=>Math.random()-0.5);
      if (Math.random()<0.7) sh.unshift(e.dir%4);
      for (const d of sh) {
        const [dc,dr]=DIRS4[d],nc=e.c+dc,nr=e.r+dr;
        if (!solid(nc,nr)&&!hasBomb(nc,nr)) { e.c=nc;e.r=nr;e.dir=d;break; }
      }
    }
    e.px+=(e.c*T+T/2-e.px)*0.22;
    e.py+=(HUD+e.r*T+T/2-e.py)*0.22;
  }
  const now=Date.now();
  while (enemySpawnQueue.length&&enemySpawnQueue[0]<=now) {
    enemySpawnQueue.shift(); spawnEnemy();
  }
}

function update(dt) {
  if (!gameOn) { updateParticles(dt); updatePopups(dt); return; }
  portalT+=dt/1000;
  for (const b of [...bombs]) { b.fuse-=dt; b.pt+=dt; if(b.fuse<=0) detonateBomb(b); }
  for (let i=explosions.length-1;i>=0;i--) {
    explosions[i].timer-=dt;
    if (explosions[i].timer<=0) explosions.splice(i,1);
  }
  updatePlayer(dt);
  updateEnemies(dt);
  checkHits();
  updateParticles(dt);
  updatePopups(dt);
}

function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.2;
    p.life-=p.decay; if (p.life<=0) particles.splice(i,1);
  }
}

function updatePopups(dt) {
  for (let i=popups.length-1;i>=0;i--) {
    const p=popups[i];
    p.y+=p.vy; p.life-=0.022;
    if (p.life<=0) popups.splice(i,1);
  }
}

// ── Draw Map ───────────────────────────────────────────────
function drawMap() {
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const x=c*T, y=HUD+r*T, tile=map[r][c];

      if (tile===WALL) {
        // Stone wall
        ctx.fillStyle='#7a6858'; ctx.fillRect(x,y,T,T);
        // mortar lines
        ctx.fillStyle='#5a4838';
        ctx.fillRect(x,y,T,2); ctx.fillRect(x,y,2,T);
        ctx.fillRect(x,y+T-2,T,2); ctx.fillRect(x+T-2,y,2,T);
        // inner stone
        ctx.fillStyle='#8e7c68'; ctx.fillRect(x+2,y+2,T-4,T-4);
        // stone highlight
        ctx.fillStyle='rgba(255,255,255,0.12)';
        ctx.fillRect(x+3,y+3,T-6,3); ctx.fillRect(x+3,y+3,3,T-6);
        ctx.fillStyle='rgba(0,0,0,0.18)';
        ctx.fillRect(x+3,y+T-6,T-6,3); ctx.fillRect(x+T-6,y+3,3,T-6);
        // rock crack
        ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x+8,y+10); ctx.lineTo(x+18,y+22); ctx.stroke();
      } else {
        // Grass floor
        ctx.fillStyle=(r+c)%2===0?'#5ac84a':'#52bc42';
        ctx.fillRect(x,y,T,T);
        // grass blade hints
        ctx.fillStyle='rgba(255,255,255,0.07)';
        ctx.fillRect(x,y,T,1);

        if (tile===BLOCK) {
          // Wooden crate
          ctx.fillStyle='#cc7832'; ctx.fillRect(x+1,y+1,T-2,T-2);
          ctx.fillStyle='#ee9848';
          ctx.fillRect(x+1,y+1,T-2,3); ctx.fillRect(x+1,y+1,3,T-2);
          ctx.fillStyle='#aa5520';
          ctx.fillRect(x+1,y+T-4,T-2,3); ctx.fillRect(x+T-4,y+1,3,T-2);
          // X pattern
          ctx.strokeStyle='#aa5520'; ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(x+5,y+5); ctx.lineTo(x+T-5,y+T-5);
          ctx.moveTo(x+T-5,y+5); ctx.lineTo(x+5,y+T-5);
          ctx.stroke();
          // center peg
          ctx.fillStyle='#ffaa55';
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,4,0,Math.PI*2); ctx.fill();

        } else if (tile===PORTAL) {
          // Golden START portal
          const p=Math.sin(portalT*2.5)*0.2+0.8;
          // glow layers
          ctx.shadowColor='#ffd700'; ctx.shadowBlur=28*p;
          const g=ctx.createRadialGradient(x+T/2,y+T/2,1,x+T/2,y+T/2,T/2);
          g.addColorStop(0,`rgba(255,255,160,${p})`);
          g.addColorStop(0.4,`rgba(255,200,0,${0.8*p})`);
          g.addColorStop(0.75,`rgba(255,120,0,${0.4*p})`);
          g.addColorStop(1,'rgba(255,80,0,0)');
          ctx.fillStyle=g; ctx.fillRect(x,y,T,T);
          ctx.shadowBlur=0;
          // spinning star ring
          for (let s=0;s<8;s++) {
            const a=portalT*2+s*Math.PI/4;
            const sr=T/2*0.75;
            const sx=x+T/2+Math.cos(a)*sr, sy=y+T/2+Math.sin(a)*sr;
            ctx.fillStyle=`rgba(255,240,80,${0.7*p})`;
            ctx.beginPath(); ctx.arc(sx,sy,2.2,0,Math.PI*2); ctx.fill();
          }
          // border ring
          ctx.strokeStyle=`rgba(255,220,0,${p})`; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,T/2-3,0,Math.PI*2); ctx.stroke();
          // label
          ctx.fillStyle=`rgba(255,240,50,${p})`;
          ctx.shadowColor='#ff8800'; ctx.shadowBlur=6*p;
          ctx.font='bold 8px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('START',x+T/2,y+T/2);
          ctx.shadowBlur=0;
        }
      }
    }
  }
}

// ── Draw Explosions ────────────────────────────────────────
function drawExplosions() {
  for (const exp of explosions) {
    const p=exp.timer/EXP_DURATION;
    for (const cell of exp.cells) {
      const x=cell.c*T+T/2, y=HUD+cell.r*T+T/2;
      if (cell.kind==='center') {
        ctx.shadowColor='#fff'; ctx.shadowBlur=30*p;
        ctx.fillStyle=`rgba(255,255,200,${p})`;
        ctx.beginPath(); ctx.arc(x,y,T/2*1.1,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(255,230,0,${p*0.9})`;
        ctx.beginPath(); ctx.arc(x,y,T/2*0.7,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(255,255,255,${p*0.8})`;
        ctx.beginPath(); ctx.arc(x,y,T/2*0.35,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      } else {
        ctx.shadowColor='#ff8800'; ctx.shadowBlur=18*p;
        ctx.fillStyle=`rgba(255,160,0,${p*0.95})`;
        ctx.fillRect(cell.c*T+3, HUD+cell.r*T+3, T-6, T-6);
        ctx.fillStyle=`rgba(255,230,0,${p*0.7})`;
        ctx.fillRect(cell.c*T+9, HUD+cell.r*T+9, T-18, T-18);
        ctx.shadowBlur=0;
      }
    }
  }
}

// ── Draw Bombs ─────────────────────────────────────────────
function drawBombs() {
  for (const b of bombs) {
    const x=b.c*T+T/2, y=HUD+b.r*T+T/2;
    const prog=b.fuse/BOMB_FUSE;
    const pulse=1+Math.sin(b.pt/160)*0.1*(1+(1-prog)*2);
    const rad=T/2*0.72*pulse;

    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x+2,y+rad*0.55,rad*0.85,rad*0.28,0,0,Math.PI*2); ctx.fill();

    // body
    const bg=ctx.createRadialGradient(x-rad*0.3,y-rad*0.3,rad*0.1,x,y,rad);
    bg.addColorStop(0,'#444'); bg.addColorStop(1,'#111');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();

    // shine
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(x-rad*0.3,y-rad*0.3,rad*0.28,0,Math.PI*2); ctx.fill();

    // fuse rope
    const fl=Math.random()<0.3;
    ctx.strokeStyle=fl?'#ffee00':'#ff6b35'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(x,y-rad);
    ctx.bezierCurveTo(x+rad*0.5,y-rad*1.3,x+rad*0.8,y-rad*1.55,x+rad*0.65,y-rad*1.8);
    ctx.stroke();
    // spark
    if (!fl) {
      ctx.shadowColor='#ffee00'; ctx.shadowBlur=10;
      ctx.fillStyle='#ffee00'; ctx.beginPath(); ctx.arc(x+rad*0.65,y-rad*1.8,4,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    // countdown ring
    ctx.strokeStyle=`hsl(${100*prog},100%,55%)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,rad+5,-Math.PI/2,-Math.PI/2+Math.PI*2*prog); ctx.stroke();
  }
}

// ── Draw Player (hero) ─────────────────────────────────────
function drawPlayer() {
  if (!player.alive) return;
  if (player.inv && Math.floor(player.blinkT/100)%2===0) return;

  const x=player.px, y=player.py, r=T/2*0.78;

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.72,r*0.72,r*0.22,0,0,Math.PI*2); ctx.fill();

  // body glow when invincible
  if (player.inv) { ctx.shadowColor='#ffffff'; ctx.shadowBlur=18; }
  else            { ctx.shadowColor='#66aaff'; ctx.shadowBlur=10; }

  // blue body
  const bg=ctx.createRadialGradient(x-r*0.3,y-r*0.2,r*0.1,x,y,r);
  bg.addColorStop(0,'#5599ff'); bg.addColorStop(1,'#2255dd');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();

  // red hero cap
  ctx.fillStyle='#ee2222';
  ctx.beginPath(); ctx.arc(x,y-r*0.1,r*0.76,Math.PI+0.1,Math.PI*2-0.1); ctx.fill();
  // cap brim
  ctx.fillStyle='#cc1111';
  ctx.fillRect(x-r*0.88,y-r*0.16,r*1.76,r*0.22);
  ctx.shadowBlur=0;

  // face (skin)
  ctx.fillStyle='#ffcc88';
  ctx.beginPath(); ctx.arc(x+r*0.06,y+r*0.1,r*0.5,0,Math.PI*2); ctx.fill();

  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-r*0.22,y,r*0.17,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.28,y,r*0.17,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a44';
  ctx.beginPath(); ctx.arc(x-r*0.2,y,r*0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.26,y,r*0.1,0,Math.PI*2); ctx.fill();
  // eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-r*0.17,y-r*0.04,r*0.04,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.29,y-r*0.04,r*0.04,0,Math.PI*2); ctx.fill();

  // smile
  ctx.strokeStyle='#996633'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(x+r*0.05,y+r*0.2,r*0.22,0.15,Math.PI-0.15); ctx.stroke();
}

// ── Draw Enemies (slimes) ──────────────────────────────────
function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const x=e.px, y=e.py;
    const w=Math.sin(e.wobble)*0.1;
    const rw=T/2*0.85*(1+w), rh=T/2*0.72*(1-w*0.5);

    // shadow
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x,y+rh*0.9,rw*0.65,rh*0.18,0,0,Math.PI*2); ctx.fill();

    // slime body
    ctx.shadowColor='#88ff66'; ctx.shadowBlur=8;
    const sg=ctx.createRadialGradient(x-rw*0.2,y-rh*0.2,rw*0.05,x,y,rw);
    sg.addColorStop(0,'#88ee44'); sg.addColorStop(1,'#33aa22');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.ellipse(x,y+rh*0.1,rw,rh,0,0,Math.PI*2); ctx.fill();

    // lighter sheen
    ctx.fillStyle='rgba(180,255,120,0.35)';
    ctx.beginPath(); ctx.ellipse(x-rw*0.18,y-rh*0.2,rw*0.5,rh*0.38,0,Math.PI,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // big eyes (googly)
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x-rw*0.3,y-rh*0.08,rw*0.25,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+rw*0.3,y-rh*0.08,rw*0.25,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(x-rw*0.28,y-rh*0.06,rw*0.13,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+rw*0.28,y-rh*0.06,rw*0.13,0,Math.PI*2); ctx.fill();
    // red pupils
    ctx.fillStyle='#ff3333';
    ctx.beginPath(); ctx.arc(x-rw*0.26,y-rh*0.04,rw*0.06,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+rw*0.26,y-rh*0.04,rw*0.06,0,Math.PI*2); ctx.fill();

    // frown teeth
    ctx.fillStyle='#002200';
    ctx.beginPath(); ctx.arc(x,y+rh*0.25,rw*0.3,0,Math.PI); ctx.fill();
    ctx.fillStyle='#fff';
    for (let t=-1;t<=1;t++) {
      ctx.fillRect(x+t*rw*0.18-rw*0.07,y+rh*0.25,rw*0.13,rh*0.15);
    }
  }
}

// ── Draw Particles ─────────────────────────────────────────
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ── Draw Score Popups ──────────────────────────────────────
function drawPopups() {
  for (const p of popups) {
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.shadowColor=p.col; ctx.shadowBlur=8;
    ctx.fillStyle=p.col;
    ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.text,p.x,p.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

// ── Draw HUD ───────────────────────────────────────────────
function drawHUD() {
  // gradient bar
  const hg=ctx.createLinearGradient(0,0,0,HUD);
  hg.addColorStop(0,'#1a3a7a'); hg.addColorStop(1,'#0e2254');
  ctx.fillStyle=hg; ctx.fillRect(0,0,CW,HUD);
  // bottom border glow
  ctx.fillStyle='#4488ff'; ctx.fillRect(0,HUD-2,CW,2);

  // title
  ctx.shadowColor='#88ccff'; ctx.shadowBlur=10;
  ctx.fillStyle='#cceeFF'; ctx.font='bold 17px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('🎮 TUC QUEST: FESTIVAL EDITION', 16, HUD/2);
  ctx.shadowBlur=0;

  // lives (red hearts)
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='10px monospace';
  ctx.textAlign='center';
  ctx.fillText('LIVES', CW/2-60, HUD/2-8);
  ctx.font='bold 20px monospace';
  let hstr='';
  for (let i=0;i<player.lives;i++) hstr+='❤️ ';
  for (let i=player.lives;i<3;i++) hstr+='🖤 ';
  ctx.fillStyle='#fff'; ctx.fillText(hstr.trim(), CW/2-60, HUD/2+7);

  // score
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='10px monospace';
  ctx.textAlign='right';
  ctx.fillText('SCORE', CW-18, HUD/2-8);
  ctx.shadowColor='#ffdd00'; ctx.shadowBlur=6;
  ctx.fillStyle='#ffee55'; ctx.font='bold 22px monospace';
  ctx.fillText(String(score).padStart(6,'0'), CW-18, HUD/2+8);
  ctx.shadowBlur=0;

  // controls hint
  ctx.fillStyle='rgba(120,160,255,0.45)'; ctx.font='11px monospace';
  ctx.textAlign='center';
  ctx.fillText('WASD / ARROWS  MOVE   ·   SPACE  BOMB', CW/2+70, HUD/2);
}

// ── Loop ───────────────────────────────────────────────────
let last=0;
function loop(ts) {
  const dt=Math.min(ts-last,50); last=ts;
  update(dt);

  // sky gradient background
  const sky=ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#1a55bb'); sky.addColorStop(1,'#2288ee');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH);

  drawMap();
  drawExplosions();
  drawBombs();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawPopups();
  drawHUD();

  requestAnimationFrame(loop);
}

// ── Main menu ──────────────────────────────────────────────
(function initMenu() {
  // Starfield
  const stars = document.getElementById('mm-stars');
  for (let i=0;i<120;i++) {
    const s=document.createElement('div');
    const sz=1+Math.random()*2.5;
    Object.assign(s.style,{
      position:'absolute',
      width:sz+'px', height:sz+'px', borderRadius:'50%',
      background:'rgba(255,255,255,'+(0.3+Math.random()*0.7)+')',
      left:Math.random()*100+'%', top:Math.random()*100+'%',
      animation:`twinkle ${2+Math.random()*3}s ${Math.random()*3}s infinite alternate`,
    });
    stars.appendChild(s);
  }
  const st=document.createElement('style');
  st.textContent='@keyframes twinkle{from{opacity:0.2}to{opacity:1}}';
  document.head.appendChild(st);

  document.getElementById('mm-bomb').addEventListener('click',()=>{
    document.getElementById('main-menu').style.display='none';
    startGame();
  });
  document.getElementById('mm-kahoot').addEventListener('click',()=>{
    window.location.href='kahoot.html';
  });
  document.getElementById('mm-hunt').addEventListener('click',()=>{
    window.location.href='hunt.html';
  });
})();

// ── Start ──────────────────────────────────────────────────
function startGame() {
  score=0; portalT=0; moveTimer=0; lastBomb=false; gameOn=true;
  bombs=[]; explosions=[]; particles=[]; popups=[]; enemySpawnQueue=[];
  initMap(); initPlayer(); initEnemies();
}

startGame();
requestAnimationFrame(loop);
</script>
