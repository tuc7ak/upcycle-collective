<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Upcycle Collective — Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f4c2a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo { font-size: 48px; margin-bottom: 8px; }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.75;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 500px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder { opacity: 0.5; }
    input:focus { border-color: #7fff7f; }

    .hint {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #4caf50;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover  { background: #43a047; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #888; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 15px;
      display: none;
    }

    .result.success {
      background: rgba(76,175,80,0.25);
      border: 1px solid #4caf50;
    }

    .result.error {
      background: rgba(244,67,54,0.25);
      border: 1px solid #f44336;
    }

    .result strong { display: block; font-size: 18px; margin-bottom: 4px; }

    .token-count {
      font-size: 48px;
      font-weight: 900;
      color: #7fff7f;
      text-align: center;
      margin: 8px 0 4px;
    }

    .explorer-link {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #aaffaa;
      text-decoration: underline;
      word-break: break-all;
    }

    .reward-section {
      margin-top: 40px;
      width: 100%;
      max-width: 500px;
    }

    .reward-section h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .reward-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .reward-btn {
      padding: 14px 8px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .reward-btn:hover { background: rgba(255,255,255,0.2); }
    .reward-btn .amount { font-size: 22px; font-weight: 900; color: #7fff7f; display: block; }

    .scan-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .scan-btn:hover { background: rgba(255,255,255,0.18); }

    #scanner-wrap { border-radius: 14px; overflow: hidden; margin-bottom: 12px; display: none; }
    #scanner-wrap video { width: 100% !important; }
    #html5-qrcode-button-camera-permission,
    #html5-qrcode-button-camera-stop,
    #html5-qrcode-anchor-scan-type-change { display: none !important; }

    .wallet-status {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
      font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.45);
    }
    .wallet-status.ready {
      background: rgba(76,175,80,0.15);
      border-color: rgba(76,175,80,0.4);
      color: #a5d6a7;
    }
    .wallet-status .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: rgba(255,255,255,0.2);
    }
    .wallet-status.ready .dot { background: #4caf50; }

    .checkin-reminder {
      display: none;
      background: rgba(76,175,80,0.2);
      border: 1px solid rgba(76,175,80,0.5);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #7fff7f;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="logo">♻️</div>
  <h1>The Upcycle Collective</h1>
  <p class="subtitle">Event Check-in · Staff Terminal</p>
  <div class="card">
    <button class="scan-btn" onclick="toggleScanner()">📷 Scan Wallet QR</button>
    <div id="scanner-wrap"><div id="qr-reader"></div></div>
    <input id="wallet" type="hidden" />
    <div class="wallet-status" id="wallet-status">
      <div class="dot"></div>
      <span id="wallet-status-text">No wallet scanned</span>
    </div>
    <div class="checkin-reminder" id="checkin-reminder">
      👇🏻 Don't forget to Check In!
    </div>

    <button id="checkin-btn" onclick="doCheckin()">Check In (+10 TUC)</button>

    <div class="result" id="result">
      <strong id="result-title"></strong>
      <div class="token-count" id="token-count"></div>
      <span id="result-msg"></span>
      <a class="explorer-link" id="explorer-link" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <div class="reward-section">
    <h2>Manual Rewards</h2>
    <div class="reward-buttons">
      <div class="reward-btn" onclick="doReward('recycle_unit')">
        <span class="amount">+10</span>
        Recycle Unit
      </div>
      <div class="reward-btn" onclick="doReward('draft_1')">
        <span class="amount">+5</span>
        Draft 1
      </div>
      <div class="reward-btn" onclick="doReward('draft_2')">
        <span class="amount">+20</span>
        Draft 2
      </div>
    </div>
  </div>

  <script>
    const BASE = '';

    let scanner = null;
    let scannerRunning = false;

    function setWalletReady(address) {
      document.getElementById('wallet').value = address;
      const status = document.getElementById('wallet-status');
      status.classList.add('ready');
      document.getElementById('wallet-status-text').textContent =
        address.slice(0, 6) + '…' + address.slice(-6);
      document.getElementById('checkin-reminder').style.display = 'block';
    }

    function clearWallet() {
      document.getElementById('wallet').value = '';
      const status = document.getElementById('wallet-status');
      status.classList.remove('ready');
      document.getElementById('wallet-status-text').textContent = 'No wallet scanned';
      document.getElementById('checkin-reminder').style.display = 'none';
    }

    async function toggleScanner() {
      if (scannerRunning) { stopScanner(); return; }
      const wrap = document.getElementById('scanner-wrap');
      wrap.style.display = 'block';
      document.getElementById('qr-reader').innerHTML = '';
      scanner = new Html5Qrcode('qr-reader');
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (text) => {
            setWalletReady(text.trim());
            stopScanner();
          },
          () => {}
        );
        scannerRunning = true;
      } catch (e) {
        wrap.style.display = 'none';
        alert('Camera access denied');
      }
    }

    function stopScanner() {
      if (scanner && scannerRunning) {
        scanner.stop().catch(() => {});
        scannerRunning = false;
      }
      document.getElementById('scanner-wrap').style.display = 'none';
    }

    function getWallet() {
      return document.getElementById('wallet').value.trim();
    }

    function showResult(type, title, count, msg, sig) {
      const el = document.getElementById('result');
      el.className = `result ${type}`;
      el.style.display = 'block';
      document.getElementById('result-title').textContent = title;
      document.getElementById('token-count').textContent = count;
      document.getElementById('result-msg').textContent = msg;
      const link = document.getElementById('explorer-link');
      if (sig) {
        link.href = `https://solscan.io/tx/${sig}`;
        link.textContent = `View on Solscan: ${sig.slice(0,20)}…`;
      } else {
        link.textContent = '';
      }
    }

    async function doCheckin() {
      const wallet = getWallet();
      if (!wallet) { alert('Scan the attendee QR code first.'); return; }
      const btn = document.getElementById('checkin-btn');
      btn.disabled = true;
      btn.textContent = 'Processing…';
      try {
        const res  = await fetch(`${BASE}/api/checkin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet }),
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '✅ Checked in!', `+${data.tokensAwarded} TUC`, wallet.slice(0,16) + '…', data.signature);
          clearWallet();
          stopScanner();
        } else {
          showResult('error', '❌ Failed', '', data.error || 'Unknown error', null);
        }
      } catch (e) {
        showResult('error', '❌ Network error', '', e.message, null);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check In (+10 TUC)';
      }
    }

    async function doReward(type) {
      const wallet = getWallet();
      if (!wallet) { alert('Scan the attendee QR code first.'); return; }
      try {
        const res  = await fetch(`${BASE}/api/reward`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet, reward: type }),
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '✅ Reward given!', `+${data.tokensAwarded} TUC`, `${type.replace('_', ' ')} · ${wallet.slice(0,16)}…`, data.signature);
          clearWallet();
        } else {
          showResult('error', '❌ Failed', '', data.error || 'Unknown error', null);
        }
      } catch (e) {
        showResult('error', '❌ Network error', '', e.message, null);
      }
    }
  </script>

</body>
</html>
