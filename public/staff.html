<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUC — Check-in Terminal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a2e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
    }

    .logo { font-size: 40px; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 2px; }
    .subtitle { font-size: 13px; opacity: 0.5; margin-bottom: 36px; }

    /* ── QR card ── */
    .qr-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%; max-width: 360px;
      text-align: center;
      margin-bottom: 20px;
    }
    .qr-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; opacity: 0.45; margin-bottom: 16px;
    }
    #qr-wrap {
      background: #fff; border-radius: 16px; padding: 14px;
      display: inline-flex; justify-content: center; margin-bottom: 14px;
    }
    .qr-hint { font-size: 13px; opacity: 0.55; margin-bottom: 4px; }
    .qr-reward {
      display: inline-block; margin-top: 10px;
      background: rgba(76,175,80,0.2); border: 1px solid rgba(76,175,80,0.4);
      border-radius: 999px; padding: 6px 18px;
      font-size: 14px; font-weight: 700; color: #7fff7f;
    }
    .memo-row {
      margin-top: 12px; font-size: 11px; opacity: 0.4; font-family: monospace;
    }

    /* ── Recent check-ins ── */
    .feed-wrap { width: 100%; max-width: 360px; margin-top: 8px; }
    .feed-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .feed-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.45; }
    .feed-badge { font-size: 11px; opacity: 0.35; }
    .feed-list { display: flex; flex-direction: column; gap: 8px; }
    .feed-row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px; padding: 11px 14px; cursor: pointer;
    }
    .feed-row:hover { background: rgba(255,255,255,0.09); }
    .feed-row.new {
      border-color: rgba(76,175,80,0.45);
      background: rgba(76,175,80,0.1);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    .feed-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }
    .feed-body { flex: 1; min-width: 0; }
    .feed-wallet { font-size: 13px; font-weight: 700; color: #7fff7f; }
    .feed-memo { font-size: 10px; font-family: monospace; opacity: 0.4; margin-top: 1px; }
    .feed-time { font-size: 11px; opacity: 0.38; text-align: right; flex-shrink: 0; }
    .feed-empty { text-align: center; opacity: 0.3; font-size: 13px; padding: 20px 0; }

    /* ── Manual rewards ── */
    .rewards-wrap { width: 100%; max-width: 360px; margin-top: 28px; }
    .rewards-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.45; margin-bottom: 12px; }
    .reward-result {
      margin-top: 10px; border-radius: 10px; padding: 12px 14px;
      font-size: 13px; display: none;
    }
    .reward-result.ok  { background: rgba(76,175,80,0.2); border: 1px solid rgba(76,175,80,0.4); }
    .reward-result.err { background: rgba(244,67,54,0.2); border: 1px solid rgba(244,67,54,0.4); }

    .scan-reward-btn {
      width: 100%; padding: 16px; border-radius: 12px; cursor: pointer;
      background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.4);
      color: #7fff7f; font-size: 15px; font-weight: 700;
    }
    .scan-reward-btn:hover { background: rgba(76,175,80,0.25); }

    #reward-scanner-wrap { margin-top: 4px; }
    #reward-scanner { border-radius: 12px; overflow: hidden; }
    .cancel-scan-btn, .rescan-btn {
      width: 100%; margin-top: 10px; padding: 10px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      background: transparent; color: rgba(255,255,255,0.6); font-size: 13px;
    }
    .cancel-scan-btn:hover, .rescan-btn:hover { background: rgba(255,255,255,0.08); }

    .scanned-wallet-chip {
      background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.4);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
      font-size: 13px; font-family: monospace; color: #7fff7f; text-align: center;
    }
    .amount-quick { display: flex; gap: 8px; margin-bottom: 10px; }
    .amount-quick button {
      flex: 1; padding: 10px 0; cursor: pointer; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.07);
      color: #fff; font-size: 14px; font-weight: 700;
    }
    .amount-quick button:hover { background: rgba(255,255,255,0.15); }
    .amount-input {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      color: #fff; font-size: 22px; font-weight: 800; text-align: center;
      padding: 14px; outline: none; margin-bottom: 10px;
    }
    .amount-input::placeholder { font-size: 13px; font-weight: 400; opacity: 0.4; }
    .amount-input:focus { border-color: #7fff7f; }
    .send-reward-btn {
      width: 100%; padding: 14px; cursor: pointer; border: none; border-radius: 12px;
      background: #4caf50; color: #fff; font-size: 15px; font-weight: 800;
    }
    .send-reward-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ── PIN GATE ── -->
<div id="pin-gate" style="position:fixed;inset:0;background:#0a2e1a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;">
  <div style="font-size:36px">🔒</div>
  <div style="font-size:20px;font-weight:800">Staff Access</div>
  <div style="font-size:13px;opacity:0.5;margin-bottom:4px">Enter PIN to continue</div>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="10" placeholder="PIN" autocomplete="off"
    style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:12px;color:#fff;font-size:24px;letter-spacing:0.3em;padding:14px 20px;text-align:center;outline:none;width:220px;"
    onkeydown="if(event.key==='Enter')checkPin()" />
  <button onclick="checkPin()" style="background:#4caf50;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;padding:14px 0;cursor:pointer;width:220px;">Unlock</button>
  <div id="pin-err" style="color:#ff8a65;font-size:13px;display:none">Incorrect PIN</div>
</div>

<script>
  (function(){
    if (sessionStorage.getItem('tuc_pin') === 'ak90') document.getElementById('pin-gate').style.display = 'none';
    else setTimeout(() => document.getElementById('pin-input')?.focus(), 100);
  })();
  function checkPin() {
    if (document.getElementById('pin-input').value === 'ak90') {
      sessionStorage.setItem('tuc_pin', 'ak90');
      document.getElementById('pin-gate').style.display = 'none';
    } else {
      document.getElementById('pin-err').style.display = 'block';
      document.getElementById('pin-input').value = '';
    }
  }
</script>

<!-- ── MAIN ── -->
<div class="logo">♻️</div>
<h1>The Upcycle Collective</h1>
<p class="subtitle">Check-in Terminal · Staff</p>

<!-- QR code card -->
<div class="qr-card">
  <div class="qr-label">Scan to Check In</div>
  <div id="qr-wrap"><div id="qr-canvas"></div></div>
  <div class="qr-hint">Open Solflare → tap scan → approve</div>
  <div class="qr-reward">+50 TUC on check-in</div>
  <div class="memo-row">On-chain memo: TUC:CHECKIN · once per 24 hours</div>
</div>

<!-- Recent check-ins feed -->
<div class="feed-wrap">
  <div class="feed-header">
    <div class="feed-title">Recent Check-ins</div>
    <div class="feed-badge" id="feed-badge">Refreshing…</div>
  </div>
  <div class="feed-list" id="feed-list">
    <div class="feed-empty">No check-ins yet today</div>
  </div>
</div>

<!-- Manual rewards -->
<div class="rewards-wrap">
  <div class="rewards-title">Manual Rewards</div>

  <button class="scan-reward-btn" id="scan-reward-btn" onclick="openRewardScanner()">📷 Scan Guest Wallet</button>

  <div id="reward-scanner-wrap" style="display:none">
    <div id="reward-scanner"></div>
    <button class="cancel-scan-btn" onclick="closeRewardScanner()">Cancel</button>
  </div>

  <div id="reward-amount-wrap" style="display:none">
    <div class="scanned-wallet-chip" id="scanned-wallet-chip"></div>
    <div class="amount-quick">
      <button type="button" onclick="setAmount(5)">+5</button>
      <button type="button" onclick="setAmount(10)">+10</button>
      <button type="button" onclick="setAmount(15)">+15</button>
      <button type="button" onclick="setAmount(20)">+20</button>
    </div>
    <input id="reward-amount" class="amount-input" type="number" inputmode="numeric" placeholder="Or type an amount" min="1" max="200" />
    <button class="send-reward-btn" id="send-reward-btn" onclick="sendManualReward()">Send TUC</button>
    <button class="rescan-btn" onclick="rescanWallet()">Scan a different wallet</button>
  </div>

  <div class="reward-result" id="reward-result"></div>
</div>

<script>
  const BASE_URL     = 'https://upcycle-collective.vercel.app';
  const CHECKIN_URL  = `${BASE_URL}/api/checkin`;
  const HELIUS_RPC   = 'https://mainnet.helius-rpc.com/?api-key=a353da56-f27a-4a7a-9091-bdc6f8d66f27';
  const MINT         = '2hgWyBDWgw4xesu8NpwTAhHgy2gnAo5iBhsBNSasngRj';
  const MEMO_PROGRAM = 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr';
  const REFRESH_MS   = 20000;

  new QRCode(document.getElementById('qr-canvas'), {
    text: `solana:${CHECKIN_URL}`,
    width: 260, height: 260,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });

  let knownSigs   = new Set();
  let isFirstLoad = true;

  async function rpc(method, params) {
    const r = await fetch(HELIUS_RPC, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
    });
    return (await r.json()).result;
  }

  async function loadFeed() {
    try {
      const sigs = await rpc('getSignaturesForAddress', [MINT, { limit: 20 }]);
      const list = document.getElementById('feed-list');
      const rows = [];

      for (const sig of (sigs ?? [])) {
        const tx = await rpc('getTransaction', [sig.signature, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0 }]);
        if (!tx) continue;

        const allIx = [
          ...(tx.transaction?.message?.instructions ?? []),
          ...(tx.meta?.innerInstructions ?? []).flatMap(ii => ii?.instructions ?? []),
        ].filter(Boolean);

        let memo = '';
        let recipient = '';
        for (const ix of allIx) {
          const pid = ix.programId ?? ix.program ?? '';
          if (pid === MEMO_PROGRAM && ix.parsed && typeof ix.parsed === 'string') memo = ix.parsed;
        }
        if (memo !== 'TUC:CHECKIN') continue;

        const keys = (tx.transaction?.message?.accountKeys ?? []).map(k => k.pubkey ?? k);
        const pre  = tx.meta?.preTokenBalances  ?? [];
        const post = tx.meta?.postTokenBalances ?? [];
        for (const p of post) {
          const preEntry = pre.find(e => e.accountIndex === p.accountIndex);
          const gained   = Number(p.uiTokenAmount?.uiAmount ?? 0) - Number(preEntry?.uiTokenAmount?.uiAmount ?? 0);
          if (gained > 0) { recipient = keys[p.accountIndex] ?? ''; break; }
        }

        rows.push({ sig: sig.signature, blockTime: tx.blockTime, recipient, memo });
        if (rows.length >= 8) break;
      }

      if (!rows.length) {
        list.innerHTML = '<div class="feed-empty">No check-ins yet today</div>';
        setFeedBadge(); return;
      }

      list.innerHTML = '';
      rows.forEach(row => {
        const isNew = !isFirstLoad && !knownSigs.has(row.sig);
        knownSigs.add(row.sig);
        const el = document.createElement('div');
        el.className = 'feed-row' + (isNew ? ' new' : '');
        el.innerHTML = `
          <div class="feed-dot"></div>
          <div class="feed-body">
            <div class="feed-wallet">${row.recipient ? row.recipient.slice(0,8)+'…'+row.recipient.slice(-6) : '—'}</div>
            <div class="feed-memo">${row.memo}</div>
          </div>
          <div class="feed-time">${relTime(row.blockTime)}</div>
        `;
        el.onclick = () => window.open(`https://solscan.io/tx/${row.sig}`, '_blank');
        list.appendChild(el);
      });

      isFirstLoad = false;
      setFeedBadge();
    } catch (e) {
      console.error('[feed]', e);
      setFeedBadge();
    }
  }

  function relTime(blockTime) {
    if (!blockTime) return '?';
    const diff = Math.floor(Date.now() / 1000) - blockTime;
    if (diff < 60)   return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }

  function setFeedBadge() {
    const now = new Date();
    document.getElementById('feed-badge').textContent =
      `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  }

  loadFeed();
  setInterval(loadFeed, REFRESH_MS);

  /* ── Manual reward: scan → amount ── */
  let rewardScanner = null, rewardScannerRunning = false, scannedWallet = null;

  function openRewardScanner() {
    document.getElementById('scan-reward-btn').style.display = 'none';
    document.getElementById('reward-amount-wrap').style.display = 'none';
    document.getElementById('reward-scanner-wrap').style.display = 'block';
    document.getElementById('reward-scanner').innerHTML = '';
    rewardScanner = new Html5Qrcode('reward-scanner');
    rewardScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      async (text) => {
        await stopRewardScanner();
        onWalletScanned(text.trim());
      },
      () => {},
    ).then(() => {
      rewardScannerRunning = true;
    }).catch(() => {
      document.getElementById('reward-scanner-wrap').style.display = 'none';
      document.getElementById('scan-reward-btn').style.display = 'block';
      showRewardResult('err', '❌ Camera access denied');
    });
  }

  async function stopRewardScanner() {
    if (rewardScanner && rewardScannerRunning) {
      await rewardScanner.stop().catch(() => {});
      rewardScannerRunning = false;
    }
    document.getElementById('reward-scanner-wrap').style.display = 'none';
  }

  function closeRewardScanner() {
    stopRewardScanner();
    document.getElementById('scan-reward-btn').style.display = 'block';
  }

  function onWalletScanned(raw) {
    let wallet = raw;
    if (wallet.startsWith('solana:')) wallet = wallet.slice(7).split('?')[0];
    scannedWallet = wallet;
    document.getElementById('scanned-wallet-chip').textContent =
      wallet.length > 20 ? wallet.slice(0, 8) + '…' + wallet.slice(-6) : wallet;
    document.getElementById('reward-amount-wrap').style.display = 'block';
    const amountInput = document.getElementById('reward-amount');
    amountInput.value = '';
    amountInput.focus();
  }

  function setAmount(n) {
    document.getElementById('reward-amount').value = n;
  }

  function rescanWallet() {
    scannedWallet = null;
    document.getElementById('reward-amount-wrap').style.display = 'none';
    openRewardScanner();
  }

  async function sendManualReward() {
    if (!scannedWallet) { showRewardResult('err', 'Scan a wallet first.'); return; }
    const amount = parseInt(document.getElementById('reward-amount').value, 10);
    if (!amount || amount < 1) { showRewardResult('err', 'Enter a valid amount.'); return; }

    const btn = document.getElementById('send-reward-btn');
    btn.disabled = true;
    try {
      const res  = await fetch('/api/reward', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wallet: scannedWallet, amount }),
      });
      const data = await res.json();
      if (data.success) {
        showRewardResult('ok', `✅ +${data.tokensAwarded} TUC → ${scannedWallet.slice(0, 10)}…`);
        document.getElementById('reward-amount-wrap').style.display = 'none';
        document.getElementById('scan-reward-btn').style.display = 'block';
        scannedWallet = null;
      } else {
        showRewardResult('err', '❌ ' + (data.error ?? 'Failed'));
      }
    } catch (e) {
      showRewardResult('err', '❌ ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function showRewardResult(type, msg) {
    const el = document.getElementById('reward-result');
    el.className = `reward-result ${type}`;
    el.style.display = 'block';
    el.textContent = msg;
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
</script>

</body>
</html>
