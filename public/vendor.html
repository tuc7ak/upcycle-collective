<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUC — Vendor</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f4c2a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 56px;
    }

    .logo { font-size: 36px; margin-bottom: 6px; }

    .vendor-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 2px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.5;
      margin-bottom: 36px;
      text-align: center;
    }

    /* ── QR ─────────────────────────────────── */
    #qr-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
    }
    #qr-wrap img, #qr-wrap canvas { display: block; }
    .qr-hint {
      font-size: 13px;
      opacity: 0.55;
      text-align: center;
      margin-bottom: 4px;
    }

    /* ── Wallet card ─────────────────────────── */
    .wallet-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
    }

    .wallet-card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 10px;
    }

    .wallet-addr {
      font-size: 13px;
      font-family: monospace;
      word-break: break-all;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 14px;
    }

    .copy-btn {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 11px;
      transition: background 0.15s;
    }
    .copy-btn:hover  { background: rgba(255,255,255,0.18); }
    .copy-btn:disabled { opacity: 0.35; cursor: default; }

    /* ── History feed ────────────────────────── */
    .history-wrap {
      width: 100%;
      max-width: 360px;
      margin-top: 28px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .refresh-badge { font-size: 11px; opacity: 0.38; }

    .history-list { display: flex; flex-direction: column; gap: 8px; }

    .tx-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .tx-row:hover { background: rgba(255,255,255,0.1); }
    .tx-row.new {
      border-color: rgba(76,175,80,0.45);
      background: rgba(76,175,80,0.1);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tx-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }

    .tx-body { flex: 1; min-width: 0; }
    .tx-amount { font-size: 16px; font-weight: 800; color: #7fff7f; line-height: 1; margin-bottom: 3px; }
    .tx-memo   { font-size: 11px; opacity: 0.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tx-time { font-size: 11px; opacity: 0.4; text-align: right; flex-shrink: 0; }

    .empty-state { text-align: center; opacity: 0.35; font-size: 14px; padding: 24px 0; }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 12px;
    }
    .total-label { font-size: 12px; opacity: 0.5; font-weight: 600; }
    .total-value { font-size: 20px; font-weight: 900; color: #7fff7f; }

    /* ── Error ───────────────────────────────── */
    .error-bar {
      display: none;
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.4);
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      margin-top: 12px;
      padding: 10px 14px;
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    .error-bar.active { display: block; }
  </style>
</head>
<body>

  <div class="logo">♻️</div>
  <div class="vendor-name" id="vendor-name">Loading…</div>
  <div class="subtitle">TUC Vendor Terminal</div>

  <div class="wallet-card">
    <div class="wallet-card-label">Scan to Pay</div>
    <div id="qr-wrap"><div id="qr-canvas"></div></div>
    <div class="qr-hint">Scan with Solflare → send TUC tokens</div>
    <div class="wallet-card-label" style="margin-top:16px">On-Chain Memo</div>
    <div class="wallet-addr" id="memo-value" style="font-size:15px;font-weight:700;opacity:1;color:#7fff7f;">—</div>
    <div class="wallet-card-label" style="margin-top:16px">Vendor Wallet Address</div>
    <div class="wallet-addr" id="wallet-addr">—</div>
    <button class="copy-btn" id="copy-btn" onclick="copyWallet()" disabled>📋 Copy Address</button>
  </div>

  <div class="error-bar" id="error-bar"></div>

  <div class="history-wrap">
    <div class="history-header">
      <div class="history-title">Recent Payments</div>
      <div class="refresh-badge" id="refresh-badge">Refreshing…</div>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-state">No payments yet</div>
    </div>
    <div class="total-row" id="total-row" style="display:none">
      <div class="total-label">Total received (this session)</div>
      <div class="total-value" id="total-value">0 TUC</div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://upcycle-collective.vercel.app';
    const REFRESH_INTERVAL = 30000;

    const TOKEN_MINT   = '2hgWyBDWgw4xesu8NpwTAhHgy2gnAo5iBhsBNSasngRj';
    const VENDOR_WALLET = 'HGPiNcN1kUUbAbpWg15hvgzNaa5b931DmC8q4YDqw1GC';

    const VENDORS = {
      'landik':       { name: 'Landik 🛍️',      cost: 20, memo: 'TUC:landik' },
      'uitm':         { name: 'UiTM 🎓',         cost: 20, memo: 'TUC:uitm' },
      'beer':         { name: 'Beer 🍺',         cost: 5,  memo: 'TUC:beer' },
      'clothes-swap': { name: 'Clothes Swap 👕', cost: 5,  memo: 'TUC:clothes-swap' },
      'creative':     { name: 'Creative 🎨',     cost: 5,  memo: 'TUC:creative' },
    };

    const params   = new URLSearchParams(window.location.search);
    const vendorId = params.get('id') || 'landik';
    const vendor   = VENDORS[vendorId];

    if (!vendor) {
      document.body.innerHTML = '<p style="color:#f44;padding:40px;text-align:center">Unknown vendor ID.<br>Use <b>?id=landik</b> in the URL.</p>';
    } else {
      document.getElementById('vendor-name').textContent = vendor.name;
      document.title = `${vendor.name} — TUC`;

      document.getElementById('memo-value').textContent = vendor.memo;
      document.getElementById('wallet-addr').textContent = VENDOR_WALLET;
      document.getElementById('copy-btn').disabled = false;

      // Solana Pay Transfer Request — encodes wallet + token + amount + memo
      // Solflare reads this natively and writes the memo on-chain
      const vendorLabel = vendor.name.replace(/\p{Emoji}/gu, '').trim();
      const transferUrl = `solana:${VENDOR_WALLET}` +
        `?spl-token=${TOKEN_MINT}` +
        `&amount=${vendor.cost}` +
        `&label=${encodeURIComponent(vendorLabel)}` +
        `&memo=${encodeURIComponent(vendor.memo)}`;

      new QRCode(document.getElementById('qr-canvas'), {
        text: transferUrl,
        width: 260,
        height: 260,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });

      loadHistory();
      setInterval(loadHistory, REFRESH_INTERVAL);
    }

    // ── Wallet copy ───────────────────────────────────────────────────────
    function copyWallet() {
      navigator.clipboard.writeText(VENDOR_WALLET).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy Address'; }, 2000);
      });
    }

    // ── History feed ──────────────────────────────────────────────────────
    let knownSigs  = new Set();
    let isFirstLoad = true;

    async function loadHistory() {
      try {
        const r    = await fetch(`${BASE_URL}/api/vendor-history?id=${vendorId}`);
        const data = await r.json();

        if (data.error) { showError(data.error); return; }
        hideError();


        const txs = data.transactions ?? [];
        if (txs.length === 0) {
          document.getElementById('history-list').innerHTML = '<div class="empty-state">No payments yet</div>';
          setRefreshBadge();
          return;
        }

        const list = document.getElementById('history-list');
        list.innerHTML = '';
        txs.forEach(tx => {
          const isNew = !isFirstLoad && !knownSigs.has(tx.signature);
          knownSigs.add(tx.signature);

          const row = document.createElement('div');
          row.className = 'tx-row' + (isNew ? ' new' : '');
          row.innerHTML = `
            <div class="tx-dot"></div>
            <div class="tx-body">
              <div class="tx-amount">+${tx.amount} TUC</div>
              <div class="tx-memo">${tx.memo || '—'}</div>
            </div>
            <div class="tx-time">${relativeTime(tx.blockTime)}</div>
          `;
          row.onclick = () => window.open(`https://solscan.io/tx/${tx.signature}`, '_blank');
          list.appendChild(row);
        });

        const totalTUC = txs.reduce((s, t) => s + t.amount, 0);
        document.getElementById('total-row').style.display = 'flex';
        document.getElementById('total-value').textContent = `${totalTUC} TUC`;

        isFirstLoad = false;
        setRefreshBadge();
      } catch {
        showError('Failed to load history');
        setRefreshBadge();
      }
    }

    function relativeTime(blockTime) {
      if (!blockTime) return '?';
      const diff = Math.floor(Date.now() / 1000) - blockTime;
      if (diff < 60)   return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      return `${Math.floor(diff / 3600)}h ago`;
    }

    function setRefreshBadge() {
      const now = new Date();
      document.getElementById('refresh-badge').textContent =
        `Updated ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    function showError(msg) { const el = document.getElementById('error-bar'); el.textContent = msg; el.classList.add('active'); }
    function hideError()    { document.getElementById('error-bar').classList.remove('active'); }
  </script>

</body>
</html>
