<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUC — Vendor Terminal</title>
  <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f4c2a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
    }

    .logo { font-size: 40px; margin-bottom: 6px; }

    .vendor-name {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 2px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 32px;
      text-align: center;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 12px;
      width: 100%;
      max-width: 480px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 28px;
    }

    .item-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      padding: 20px 12px;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
    }
    .item-btn:hover  { background: rgba(255,255,255,0.18); }
    .item-btn:active { transform: scale(0.96); }

    .item-btn .amount {
      display: block;
      font-size: 32px;
      font-weight: 900;
      color: #7fff7f;
      line-height: 1;
      margin-bottom: 6px;
    }
    .item-btn .item-name {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* Custom amount row (for Spice Market etc.) */
    .custom-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 32px;
    }
    .custom-row input {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 16px;
      outline: none;
    }
    .custom-row input::placeholder { opacity: 0.4; }
    .custom-row input:focus { border-color: #7fff7f; }
    .custom-row button {
      background: #4caf50;
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 20px;
      transition: background 0.15s;
    }
    .custom-row button:hover { background: #43a047; }

    /* QR overlay */
    .qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 35, 20, 0.97);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .qr-overlay.active { display: flex; }

    .qr-header {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      text-align: center;
    }
    .qr-sub {
      font-size: 15px;
      opacity: 0.65;
      margin-bottom: 28px;
      text-align: center;
    }
    .qr-cost {
      font-size: 52px;
      font-weight: 900;
      color: #7fff7f;
      margin-bottom: 28px;
      line-height: 1;
    }

    #qr-canvas-wrap {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 24px;
    }
    #qr-canvas-wrap canvas { display: block; }

    .qr-instruction {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.5;
    }

    .timer-bar-wrap {
      width: 260px;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: #4caf50;
      border-radius: 3px;
      width: 100%;
      transition: width 1s linear;
    }

    .cancel-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 32px;
      transition: background 0.15s;
    }
    .cancel-btn:hover { background: rgba(255,255,255,0.18); }

    /* Success flash */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 101, 52, 0.98);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .success-overlay.active { display: flex; }
    .success-icon { font-size: 80px; margin-bottom: 16px; }
    .success-title { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
    .success-amount { font-size: 52px; font-weight: 900; color: #7fff7f; margin-bottom: 24px; }
    .next-btn {
      background: #fff;
      border: none;
      border-radius: 14px;
      color: #0f4c2a;
      cursor: pointer;
      font-size: 18px;
      font-weight: 800;
      padding: 18px 48px;
      transition: opacity 0.15s;
    }
    .next-btn:hover { opacity: 0.9; }

    /* Error state */
    .error-msg {
      background: rgba(244,67,54,0.2);
      border: 1px solid #f44336;
      border-radius: 12px;
      color: #fff;
      display: none;
      font-size: 14px;
      margin-top: 12px;
      padding: 12px 16px;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    .error-msg.active { display: block; }
  </style>
</head>
<body>

  <div class="logo">♻️</div>
  <div class="vendor-name" id="vendor-name">Loading…</div>
  <div class="subtitle">TUC Vendor Terminal · Scan to pay</div>

  <div class="section-label">Select item</div>
  <div class="items-grid" id="items-grid"></div>

  <div id="custom-section" style="display:none; width:100%; max-width:480px;">
    <div class="section-label">Custom amount</div>
    <div class="custom-row">
      <input id="custom-amount" type="number" min="1" placeholder="TUC amount" />
      <button onclick="openQR('Custom', parseInt(document.getElementById('custom-amount').value))">Show QR</button>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <!-- QR overlay -->
  <div class="qr-overlay" id="qr-overlay">
    <div class="qr-header" id="qr-header"></div>
    <div class="qr-sub" id="qr-sub"></div>
    <div class="qr-cost" id="qr-cost"></div>
    <div id="qr-canvas-wrap"><canvas id="qr-canvas"></canvas></div>
    <div class="qr-instruction">Ask attendee to open Phantom and scan this QR</div>
    <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
    <button class="cancel-btn" onclick="closeQR()">✕ Cancel</button>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="success-overlay">
    <div class="success-icon">✅</div>
    <div class="success-title">Payment Received!</div>
    <div class="success-amount" id="success-amount"></div>
    <button class="next-btn" onclick="closeSuccess()">Next Customer</button>
  </div>

  <script>
    const BASE_URL = 'https://upcycle-collective.vercel.app';

    // ── Vendor config ──────────────────────────────────────────────
    // Each vendor gets their URL: /vendor.html?id=beer-stall
    const VENDORS = {
      'beer-stall': {
        name: 'Beer Stall 🍺',
        items: [
          { name: 'Beer',     cost: 5 },
          { name: 'Cocktail', cost: 8 },
          { name: 'Water',    cost: 2 },
        ],
      },
      'food-booth': {
        name: 'Food Booth 🍛',
        items: [
          { name: 'Meal Set',  cost: 8 },
          { name: 'Snack',     cost: 3 },
          { name: 'Drink',     cost: 2 },
        ],
      },
      'merch': {
        name: 'Merch 👕',
        items: [
          { name: 'T-Shirt',   cost: 15 },
          { name: 'Tote Bag',  cost: 10 },
          { name: 'Sticker',   cost: 3  },
        ],
      },
      'vip': {
        name: 'VIP Upgrade ⭐',
        items: [
          { name: 'VIP Pass', cost: 30 },
        ],
      },
      'game-zone': {
        name: 'Game Zone 🎮',
        items: [
          { name: 'Play',     cost: 3 },
          { name: '3× Plays', cost: 8 },
        ],
      },
      'spice-market': {
        name: 'Spice Market 🌶',
        items: [],
        customAmount: true,
      },
    };

    // ── Init ───────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const vendorId = params.get('id') || 'beer-stall';
    const vendor = VENDORS[vendorId];

    if (!vendor) {
      document.body.innerHTML = '<p style="color:#f44;padding:40px;text-align:center">Unknown vendor ID. Use ?id=beer-stall in the URL.</p>';
    } else {
      document.getElementById('vendor-name').textContent = vendor.name;
      document.title = `${vendor.name} — TUC`;

      const grid = document.getElementById('items-grid');
      vendor.items.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'item-btn';
        btn.innerHTML = `<span class="amount">+${item.cost}</span><span class="item-name">${item.name}</span>`;
        btn.onclick = () => openQR(item.name, item.cost);
        grid.appendChild(btn);
      });

      if (vendor.customAmount) {
        document.getElementById('custom-section').style.display = 'block';
        if (vendor.items.length === 0) {
          document.querySelector('.section-label').style.display = 'none';
        }
      }
    }

    // ── QR overlay ─────────────────────────────────────────────────
    let timerInterval = null;
    const QR_TIMEOUT_SECS = 120;

    function openQR(itemName, cost) {
      if (!cost || cost < 1 || isNaN(cost)) {
        showError('Please enter a valid amount.');
        return;
      }
      hideError();

      const payUrl = `${BASE_URL}/api/pay/${vendorId}?amount=${cost}`;
      const solanaPayUrl = `solana:${payUrl}`;

      document.getElementById('qr-header').textContent = vendor.name;
      document.getElementById('qr-sub').textContent = itemName;
      document.getElementById('qr-cost').textContent = `${cost} TUC`;

      QRCode.toCanvas(document.getElementById('qr-canvas'), solanaPayUrl, {
        width: 240,
        margin: 0,
        color: { dark: '#000000', light: '#ffffff' },
      });

      document.getElementById('qr-overlay').classList.add('active');
      startTimer();
    }

    function closeQR() {
      document.getElementById('qr-overlay').classList.remove('active');
      clearInterval(timerInterval);
    }

    function startTimer() {
      const bar = document.getElementById('timer-bar');
      bar.style.transition = 'none';
      bar.style.width = '100%';

      let remaining = QR_TIMEOUT_SECS;
      clearInterval(timerInterval);

      requestAnimationFrame(() => {
        bar.style.transition = `width ${QR_TIMEOUT_SECS}s linear`;
        bar.style.width = '0%';
      });

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          closeQR();
        }
      }, 1000);
    }

    // ── Success overlay ────────────────────────────────────────────
    function showSuccess(cost) {
      closeQR();
      document.getElementById('success-amount').textContent = `${cost} TUC`;
      document.getElementById('success-overlay').classList.add('active');
      setTimeout(closeSuccess, 5000);
    }

    function closeSuccess() {
      document.getElementById('success-overlay').classList.remove('active');
    }

    // ── Error ──────────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('active');
    }
    function hideError() {
      document.getElementById('error-msg').classList.remove('active');
    }
  </script>

</body>
</html>
