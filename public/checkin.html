<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUC — Check-in Terminal</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a2e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
    }

    .logo { font-size: 40px; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 2px; }
    .subtitle { font-size: 13px; opacity: 0.5; margin-bottom: 36px; }

    /* ── QR card ── */
    .qr-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%; max-width: 360px;
      text-align: center;
      margin-bottom: 20px;
    }
    .qr-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; opacity: 0.45; margin-bottom: 16px;
    }
    #qr-wrap {
      background: #fff; border-radius: 16px; padding: 14px;
      display: inline-flex; justify-content: center; margin-bottom: 14px;
    }
    .qr-hint { font-size: 13px; opacity: 0.55; margin-bottom: 4px; }
    .qr-reward {
      display: inline-block; margin-top: 10px;
      background: rgba(76,175,80,0.2); border: 1px solid rgba(76,175,80,0.4);
      border-radius: 999px; padding: 6px 18px;
      font-size: 14px; font-weight: 700; color: #7fff7f;
    }
    .memo-row {
      margin-top: 12px; font-size: 11px; opacity: 0.4; font-family: monospace;
    }

    /* ── Recent check-ins ── */
    .feed-wrap { width: 100%; max-width: 360px; margin-top: 8px; }
    .feed-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .feed-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.45; }
    .feed-badge { font-size: 11px; opacity: 0.35; }
    .feed-list { display: flex; flex-direction: column; gap: 8px; }
    .feed-row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px; padding: 11px 14px; cursor: pointer;
    }
    .feed-row:hover { background: rgba(255,255,255,0.09); }
    .feed-row.new {
      border-color: rgba(76,175,80,0.45);
      background: rgba(76,175,80,0.1);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    .feed-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }
    .feed-body { flex: 1; min-width: 0; }
    .feed-wallet { font-size: 13px; font-weight: 700; color: #7fff7f; }
    .feed-memo { font-size: 10px; font-family: monospace; opacity: 0.4; margin-top: 1px; }
    .feed-time { font-size: 11px; opacity: 0.38; text-align: right; flex-shrink: 0; }
    .feed-empty { text-align: center; opacity: 0.3; font-size: 13px; padding: 20px 0; }
  </style>
</head>
<body>

<!-- ── PIN GATE ── -->
<div id="pin-gate" style="position:fixed;inset:0;background:#0a2e1a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;">
  <div style="font-size:36px">🔒</div>
  <div style="font-size:20px;font-weight:800">Staff Access</div>
  <div style="font-size:13px;opacity:0.5;margin-bottom:4px">Enter PIN to continue</div>
  <input id="pin-input" type="password" maxlength="10" placeholder="PIN" autocomplete="off"
    style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:12px;color:#fff;font-size:24px;letter-spacing:0.3em;padding:14px 20px;text-align:center;outline:none;width:220px;"
    onkeydown="if(event.key==='Enter')checkPin()" />
  <button onclick="checkPin()" style="background:#4caf50;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;padding:14px 0;cursor:pointer;width:220px;">Unlock</button>
  <div id="pin-err" style="color:#ff8a65;font-size:13px;display:none">Incorrect PIN</div>
</div>

<script>
  (function(){
    if (sessionStorage.getItem('tuc_pin') === '1990') document.getElementById('pin-gate').style.display = 'none';
    else setTimeout(() => document.getElementById('pin-input')?.focus(), 100);
  })();
  function checkPin() {
    if (document.getElementById('pin-input').value === '1990') {
      sessionStorage.setItem('tuc_pin', '1990');
      document.getElementById('pin-gate').style.display = 'none';
    } else {
      document.getElementById('pin-err').style.display = 'block';
      document.getElementById('pin-input').value = '';
    }
  }
</script>

<!-- ── MAIN ── -->
<div class="logo">♻️</div>
<h1>The Upcycle Collective</h1>
<p class="subtitle">Check-in Terminal · Staff</p>

<!-- QR code card -->
<div class="qr-card">
  <div class="qr-label">Scan to Check In</div>
  <div id="qr-wrap"><div id="qr-canvas"></div></div>
  <div class="qr-hint">Open TUC App → tap scan → approve</div>
  <div class="memo-row">On-chain memo: wTUC:CHECKIN · once per day (resets at midnight MYT)</div>
</div>

<!-- Recent check-ins feed -->
<div class="feed-wrap">
  <div class="feed-header">
    <div class="feed-title">Recent Check-ins</div>
    <div class="feed-badge" id="feed-badge">Refreshing…</div>
  </div>
  <div class="feed-list" id="feed-list">
    <div class="feed-empty">No check-ins yet today</div>
  </div>
</div>


<script>
  const BASE_URL     = 'https://upcycle-collective.vercel.app';
  const CHECKIN_URL  = `${BASE_URL}/api/checkin`;
  const HELIUS_RPC   = 'https://mainnet.helius-rpc.com/?api-key=a353da56-f27a-4a7a-9091-bdc6f8d66f27';
  const MINT         = 'AQbA6U1aHJen4Y85Skn8GYJgYcqKWT6atBaH8JQX87yz'; // wTUC
  const ORGANISER    = 'CGDLbYHVnoMpw2CCbKMMomm6U3ByVZRFqKuGZfpdsrBK';
  const MEMO_PROGRAM = 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr';
  const REFRESH_MS   = 20000;

  new QRCode(document.getElementById('qr-canvas'), {
    text: `solana:${CHECKIN_URL}`,
    width: 260, height: 260,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });

  let knownSigs   = new Set();
  let isFirstLoad = true;

  async function rpc(method, params) {
    const r = await fetch(HELIUS_RPC, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
    });
    return (await r.json()).result;
  }

  async function loadFeed() {
    try {
      // Check-in is memo-only now — it never touches the mint account, so
      // this scans the organiser's own signature history instead (the
      // organiser is fee payer on every check-in transaction).
      const sigs = await rpc('getSignaturesForAddress', [ORGANISER, { limit: 20 }]);
      const list = document.getElementById('feed-list');
      const rows = [];

      for (const sig of (sigs ?? [])) {
        const tx = await rpc('getTransaction', [sig.signature, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0 }]);
        if (!tx) continue;

        const allIx = [
          ...(tx.transaction?.message?.instructions ?? []),
          ...(tx.meta?.innerInstructions ?? []).flatMap(ii => ii?.instructions ?? []),
        ].filter(Boolean);

        let memo = '';
        let recipient = '';
        for (const ix of allIx) {
          const pid = ix.programId ?? ix.program ?? '';
          if (pid === MEMO_PROGRAM && ix.parsed && typeof ix.parsed === 'string') memo = ix.parsed;
        }
        if (memo !== 'wTUC:CHECKIN') continue;

        // Memo-only now — no token balance change to spot the attendee from.
        // The attendee is simply the other signer on the transaction (the
        // organiser is always the fee payer / first signer).
        const accountKeys = tx.transaction?.message?.accountKeys ?? [];
        const signerKeys  = accountKeys.filter(k => k?.signer).map(k => k.pubkey ?? k);
        recipient = signerKeys.find(k => k !== ORGANISER) || '';

        rows.push({ sig: sig.signature, blockTime: tx.blockTime, recipient, memo });
        if (rows.length >= 8) break;
      }

      if (!rows.length) {
        list.innerHTML = '<div class="feed-empty">No check-ins yet today</div>';
        setFeedBadge(); return;
      }

      list.innerHTML = '';
      rows.forEach(row => {
        const isNew = !isFirstLoad && !knownSigs.has(row.sig);
        knownSigs.add(row.sig);
        const el = document.createElement('div');
        el.className = 'feed-row' + (isNew ? ' new' : '');
        el.innerHTML = `
          <div class="feed-dot"></div>
          <div class="feed-body">
            <div class="feed-wallet">${row.recipient ? row.recipient.slice(0,8)+'…'+row.recipient.slice(-6) : '—'}</div>
            <div class="feed-memo">${row.memo}</div>
          </div>
          <div class="feed-time">${relTime(row.blockTime)}</div>
        `;
        el.onclick = () => window.open(`https://solscan.io/tx/${row.sig}`, '_blank');
        list.appendChild(el);
      });

      isFirstLoad = false;
      setFeedBadge();
    } catch (e) {
      console.error('[feed]', e);
      setFeedBadge();
    }
  }

  function relTime(blockTime) {
    if (!blockTime) return '?';
    const diff = Math.floor(Date.now() / 1000) - blockTime;
    if (diff < 60)   return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    return `${Math.floor(diff/3600)}h ago`;
  }

  function setFeedBadge() {
    const now = new Date();
    document.getElementById('feed-badge').textContent =
      `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  }

  loadFeed();
  setInterval(loadFeed, REFRESH_MS);

</script>

</body>
</html>
