<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TUC Card — 6 Layouts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
* { margin:0; padding:0; box-sizing:border-box; }

/* ── Page ── */
body {
  font-family:'Inter',sans-serif;
  background:#0d1117;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:32px 24px 60px;
  gap:28px;
}

/* ── Header ── */
.top-bar {
  width:100%; max-width:1500px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:18px 28px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
}
.top-info h1 { font-size:20px; font-weight:900; color:#fff; }
.top-info p  { font-size:13px; color:rgba(255,255,255,.38); margin-top:3px; }
.top-right   { display:flex; align-items:center; gap:14px; }
#selection-label {
  font-size:13px; color:rgba(255,255,255,.4);
  padding:8px 16px; background:rgba(255,255,255,.05);
  border-radius:8px; white-space:nowrap;
}
#btn-print {
  padding:12px 32px; font-size:15px; font-weight:800;
  background:#a3e635; color:#0c1a0e; border:none;
  border-radius:999px; cursor:pointer;
  box-shadow:0 4px 0 #6aaa1a;
  transition:transform .1s,box-shadow .1s;
  opacity:.35; pointer-events:none;
}
#btn-print.active { opacity:1; pointer-events:all; }
#btn-print.active:hover  { transform:translateY(-2px); box-shadow:0 6px 0 #6aaa1a; }
#btn-print.active:active { transform:translateY(2px);  box-shadow:0 2px 0 #6aaa1a; }

/* ── Showcase grid ── */
.showcase {
  display:grid;
  grid-template-columns:repeat(3,auto);
  gap:44px 60px;
}
.style-option {
  display:flex; flex-direction:column; align-items:center; gap:14px;
  cursor:pointer;
}
.card-pair {
  display:flex; gap:12px; align-items:flex-start;
  transition:transform .15s;
}
.style-option:hover .card-pair { transform:translateY(-5px); }
.style-option.selected .card-pair {
  filter:drop-shadow(0 0 8px rgba(163,230,53,.5));
  transform:translateY(-3px);
}
.pair-side { display:flex; flex-direction:column; align-items:center; gap:5px; }
.pair-lbl  { font-size:10px; font-weight:700; letter-spacing:.18em; color:rgba(255,255,255,.22); text-transform:uppercase; }
.style-meta { display:flex; flex-direction:column; align-items:center; gap:3px; }
.style-num  { font-size:11px; font-weight:700; letter-spacing:.18em; color:rgba(255,255,255,.28); text-transform:uppercase; }
.style-name { font-size:15px; font-weight:800; color:#fff; }
.style-desc { font-size:12px; color:rgba(255,255,255,.38); }
.style-option.selected .style-name { color:#a3e635; }

/* ── Base card ── */
.card {
  width:85.6mm; height:54mm;
  border-radius:2.8mm; overflow:hidden;
  position:relative; flex-shrink:0;
  font-family:'Inter','Helvetica Neue',Arial,sans-serif;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ══════════════════════════════════════════════════════════
   S1: DARK FOREST — Horizontal Split (Left brand | Right QR)
   ══════════════════════════════════════════════════════════ */
.f1 {
  background-color:#0c1a0e;
  background-image:radial-gradient(circle,rgba(163,230,53,.18) 1px,transparent 1px);
  background-size:4mm 4mm;
  display:flex; flex-direction:column;
}
.f1-top-strip { width:100%; height:1.4mm; background:#a3e635; flex-shrink:0; }
.f1-body { display:flex; flex:1; min-height:0; }
.f1-left {
  width:48%; display:flex; flex-direction:column;
  justify-content:space-between;
  padding:2.5mm 2.5mm 2.5mm 3mm;
}
.f1-divider {
  width:.35mm; flex-shrink:0; align-self:stretch; margin:3mm 0;
  background:linear-gradient(to bottom,transparent,#a3e635 20%,#a3e635 80%,transparent);
}
.f1-right { width:52%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5mm; }

.f1-brand { display:flex; flex-direction:column; gap:.6mm; }
.f1-brand-icon { font-size:5mm; line-height:1; }
.f1-brand-name { font-size:2.6mm; font-weight:900; color:#a3e635; letter-spacing:.04em; line-height:1.2; }
.f1-event-date { font-size:1.9mm; color:rgba(255,255,255,.45); letter-spacing:.06em; text-transform:uppercase; margin-top:.4mm; }
.f1-cta { display:flex; flex-direction:column; gap:.8mm; }
.f1-cta-head { font-size:2.2mm; font-weight:700; color:#fff; line-height:1.3; }
.f1-cta-sub  { font-size:1.8mm; color:rgba(255,255,255,.45); line-height:1.3; }
.f1-steps { display:flex; flex-direction:column; gap:.8mm; }
.f1-step  { font-size:1.75mm; color:rgba(255,255,255,.45); display:flex; align-items:center; gap:1.2mm; line-height:1.3; }
.f1-step::before { content:''; display:inline-block; width:1.4mm; height:1.4mm; border-radius:50%; background:#a3e635; flex-shrink:0; }
.f1-footer { display:flex; align-items:center; gap:1.5mm; }
.f1-footer-logo { height:3.5mm; width:auto; display:block; }
.f1-footer-sep  { width:.25mm; height:3mm; background:rgba(255,255,255,.25); }
.f1-footer-sol  { font-size:1.8mm; color:rgba(255,255,255,.45); letter-spacing:.04em; }
.f1-qr-box { background:#fff; padding:1.5mm; box-shadow:0 0 4mm 1mm rgba(163,230,53,.45); display:flex; align-items:center; justify-content:center; }
.f1-qr-box img { width:22mm; height:22mm; display:block; }
.f1-scan-label { font-size:2mm; font-weight:700; color:#a3e635; letter-spacing:.1em; text-transform:uppercase; }

/* S1 back */
.b1 {
  background-color:#0c1a0e;
  background-image:radial-gradient(circle,rgba(163,230,53,.15) 1px,transparent 1px);
  background-size:4mm 4mm;
  display:flex; align-items:center; justify-content:center;
}
.b1-strip-top    { position:absolute; top:0; left:0; width:100%; height:1.4mm; background:#a3e635; }
.b1-strip-bottom { position:absolute; bottom:0; left:0; width:100%; height:1.4mm; background:#a3e635; }
.b1-content { display:flex; flex-direction:column; align-items:center; gap:1.6mm; text-align:center; padding:0 5mm; }
.b1-icon    { font-size:10mm; line-height:1; }
.b1-name    { font-size:4mm; font-weight:900; color:#a3e635; letter-spacing:.05em; line-height:1.1; }
.b1-tagline { font-size:2mm; color:rgba(255,255,255,.45); letter-spacing:.04em; }
.b1-line    { width:20mm; height:.3mm; background:linear-gradient(to right,transparent,#a3e635,transparent); }
.b1-date    { font-size:2mm; color:rgba(255,255,255,.45); letter-spacing:.1em; text-transform:uppercase; }
.b1-footer      { display:flex; align-items:center; gap:1.5mm; margin-top:.5mm; }
.b1-footer-logo { height:3.5mm; width:auto; display:block; }
.b1-footer-sep  { width:.25mm; height:3mm; background:rgba(255,255,255,.25); }
.b1-footer-sol  { font-size:1.8mm; color:rgba(255,255,255,.45); letter-spacing:.04em; }

/* ══════════════════════════════════════════════════════════
   S2: SNOW WHITE — Large QR Left Panel | Text Right
   ══════════════════════════════════════════════════════════ */
.f2 {
  background:#fff;
  border:.3mm solid #a3e635;
  display:flex; flex-direction:column;
}
.f2-top-strip { width:100%; height:1.4mm; background:#a3e635; flex-shrink:0; }
.f2-body { display:flex; flex:1; min-height:0; }
.f2-left {
  width:38%; background:#f4fce8; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.5mm; padding:2mm;
}
.f2-divider {
  width:.35mm; flex-shrink:0; align-self:stretch; margin:3mm 0;
  background:linear-gradient(to bottom,transparent,#a3e635 20%,#a3e635 80%,transparent);
}
.f2-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:2.5mm 3mm 2.5mm 2.5mm; }
.f2-qr-box { border:.5mm solid #a3e635; padding:1.5mm; background:#fff; display:flex; align-items:center; justify-content:center; }
.f2-qr-box img { width:22mm; height:22mm; display:block; }
.f2-scan-label { font-size:2mm; font-weight:700; color:#0f2d18; letter-spacing:.1em; text-transform:uppercase; text-align:center; }
.f2-brand { display:flex; flex-direction:column; gap:.5mm; }
.f2-brand-icon { font-size:4.5mm; line-height:1; }
.f2-brand-name { font-size:2.6mm; font-weight:900; color:#0f2d18; letter-spacing:.04em; line-height:1.2; }
.f2-cta { display:flex; flex-direction:column; gap:.8mm; }
.f2-cta-head { font-size:2.2mm; font-weight:700; color:#0f2d18; line-height:1.3; }
.f2-cta-sub  { font-size:1.8mm; color:rgba(15,45,24,.55); line-height:1.3; }
.f2-steps { display:flex; flex-direction:column; gap:.8mm; }
.f2-step  { font-size:1.75mm; color:rgba(15,45,24,.55); display:flex; align-items:center; gap:1.2mm; line-height:1.3; }
.f2-step::before { content:''; display:inline-block; width:1.4mm; height:1.4mm; border-radius:50%; background:#a3e635; flex-shrink:0; }
.f2-event-date { font-size:1.9mm; color:rgba(15,45,24,.45); letter-spacing:.06em; text-transform:uppercase; }
.f2-footer { display:flex; align-items:center; gap:1.5mm; }
.f2-footer-logo { height:3.5mm; width:auto; display:block; filter:brightness(0) saturate(100%) invert(9%) sepia(38%) saturate(1200%) hue-rotate(95deg) brightness(90%) contrast(110%); }
.f2-footer-sep  { width:.25mm; height:3mm; background:rgba(15,45,24,.25); }
.f2-footer-sol  { font-size:1.8mm; color:rgba(15,45,24,.45); letter-spacing:.04em; }

/* S2 back */
.b2 { background:#fff; border:.3mm solid #a3e635; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.b2-strip-top { position:absolute; top:0; left:0; width:100%; height:1.4mm; background:#a3e635; }
.b2-content { display:flex; flex-direction:column; align-items:center; gap:1.8mm; text-align:center; padding:0 6mm; padding-top:1.4mm; }
.b2-circle { width:14mm; height:14mm; border-radius:50%; border:1mm solid #a3e635; background:#f4fce8; display:flex; align-items:center; justify-content:center; }
.b2-circle-icon { font-size:7mm; line-height:1; }
.b2-name    { font-size:3.8mm; font-weight:900; color:#0f2d18; letter-spacing:.04em; line-height:1.2; }
.b2-line    { width:18mm; height:.3mm; background:#a3e635; }
.b2-date    { font-size:2mm; color:#7a9a7a; letter-spacing:.1em; text-transform:uppercase; }
.b2-tagline { font-size:1.9mm; color:rgba(15,45,24,.45); letter-spacing:.03em; }
.b2-footer      { display:flex; align-items:center; gap:1.5mm; margin-top:.3mm; }
.b2-footer-logo { height:3.5mm; width:auto; display:block; filter:brightness(0) saturate(100%) invert(9%) sepia(38%) saturate(1200%) hue-rotate(95deg) brightness(90%) contrast(110%); }
.b2-footer-sep  { width:.25mm; height:3mm; background:rgba(15,45,24,.25); }
.b2-footer-sol  { font-size:1.8mm; color:rgba(15,45,24,.45); letter-spacing:.04em; }

/* ══════════════════════════════════════════════════════════
   S3: NEON NIGHT — Vertical Stack (brand top | QR center | steps bottom)
   ══════════════════════════════════════════════════════════ */
.f3 { background-color:#020c04; display:flex; flex-direction:column; }
.f3::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,102,.03) 2px,rgba(0,255,102,.03) 4px);
}
.f3-top-strip { width:100%; height:1.4mm; background:linear-gradient(90deg,#00ff66,#00cc52,#00ff66); flex-shrink:0; }
.f3-header { display:flex; align-items:center; justify-content:space-between; padding:1.6mm 2.5mm .8mm 2.5mm; flex-shrink:0; }
.f3-brand { display:flex; align-items:center; gap:1mm; font-size:2.6mm; font-weight:700; color:#00ff66; letter-spacing:.04em; line-height:1; }
.f3-brand-icon { font-size:3mm; line-height:1; }
.f3-event-date { font-size:1.8mm; color:rgba(0,255,102,.5); font-weight:500; letter-spacing:.06em; line-height:1; }
.f3-divider { width:calc(100% - 5mm); margin:0 2.5mm; height:.3mm; background:rgba(0,255,102,.25); flex-shrink:0; }
.f3-qr-area { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; padding:1.5mm 0 .5mm; gap:1.5mm; }
.f3-qr-box  { width:22mm; height:22mm; background:#020c04; border:.5mm solid #00ff66; box-shadow:0 0 5mm rgba(0,255,102,.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.f3-qr-box img { width:19mm; height:19mm; display:block; }
.f3-cta { font-size:2mm; font-weight:700; color:#00ff66; letter-spacing:.14em; text-align:center; line-height:1; }
.f3-footer-row { display:flex; align-items:center; justify-content:space-between; padding:.8mm 2.5mm 2mm 2.5mm; flex-shrink:0; }
.f3-steps { display:flex; flex-direction:column; gap:.7mm; }
.f3-step  { font-size:1.7mm; color:rgba(0,255,102,.5); display:flex; align-items:center; gap:1mm; line-height:1; }
.f3-step::before { content:''; display:inline-block; width:1.2mm; height:1.2mm; border-radius:50%; background:#00ff66; flex-shrink:0; }
.f3-footer-brand { display:flex; align-items:center; gap:1.5mm; }
.f3-footer-logo  { height:4mm; width:auto; opacity:.55; }
.f3-solana { font-size:1.8mm; color:rgba(0,255,102,.45); font-weight:600; letter-spacing:.05em; }

/* S3 back */
.b3 { background-color:#020c04; display:flex; align-items:center; justify-content:center; }
.b3::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,102,.03) 2px,rgba(0,255,102,.03) 4px);
}
.b3-glow    { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30mm; height:30mm; background:radial-gradient(circle,rgba(0,255,102,.18) 0%,transparent 70%); pointer-events:none; }
.b3-content { position:relative; display:flex; flex-direction:column; align-items:center; gap:1.6mm; }
.b3-icon    { font-size:8mm; line-height:1; filter:drop-shadow(0 0 3mm rgba(0,255,102,.8)) drop-shadow(0 0 6mm rgba(0,255,102,.4)); }
.b3-brand   { font-size:3.2mm; font-weight:800; color:#00ff66; letter-spacing:.1em; text-align:center; text-shadow:0 0 4mm rgba(0,255,102,.7),0 0 8mm rgba(0,255,102,.3); line-height:1; }
.b3-sub     { font-size:1.9mm; color:rgba(0,255,102,.5); letter-spacing:.12em; text-align:center; text-transform:uppercase; line-height:1; }
.b3-divider { width:28mm; height:.3mm; background:linear-gradient(90deg,transparent,rgba(0,255,102,.4),transparent); }
.b3-date    { font-size:1.9mm; color:rgba(0,255,102,.5); letter-spacing:.14em; text-transform:uppercase; text-align:center; line-height:1; }
.b3-footer      { display:flex; align-items:center; gap:1.5mm; margin-top:.5mm; }
.b3-footer-logo { height:3.5mm; width:auto; filter:hue-rotate(90deg) saturate(1.2) brightness(.75); }
.b3-solana { font-size:1.8mm; color:rgba(0,255,102,.4); font-weight:600; letter-spacing:.06em; }

/* ══════════════════════════════════════════════════════════
   S4: GOLD EDITION — Framed Premium (double ornamental frame)
   ══════════════════════════════════════════════════════════ */
.f4 {
  background-color:#090600;
  background-image:radial-gradient(ellipse at 50% 45%,rgba(212,168,48,.14) 0%,transparent 65%);
  display:flex; flex-direction:column;
}
.f4-outer-frame { position:absolute; inset:2.5mm; border:.5mm solid rgba(212,168,48,.45); border-radius:1.5mm; pointer-events:none; z-index:5; }
.f4-inner-frame { position:absolute; inset:4mm;   border:.3mm solid rgba(212,168,48,.2);  border-radius:1mm;   pointer-events:none; z-index:5; }
.f4-top-strip { width:100%; height:1.4mm; background:linear-gradient(90deg,#6a4600,#d4a830,#f5cc55,#d4a830,#6a4600); flex-shrink:0; position:relative; z-index:6; }
.f4-content { position:relative; z-index:6; display:flex; flex-direction:column; flex:1; padding:2mm 4mm 2.5mm 4mm; }
.f4-header  { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5mm; }
.f4-brand   { display:flex; align-items:center; gap:1mm; font-size:2.5mm; font-weight:700; color:#d4a830; letter-spacing:.04em; line-height:1; }
.f4-brand-icon { font-size:3mm; line-height:1; }
.f4-event-date { font-size:1.8mm; color:rgba(212,168,48,.55); font-weight:500; letter-spacing:.05em; line-height:1; }
.f4-center-row { display:flex; align-items:center; gap:3mm; flex:1; }
.f4-info-col   { flex:0 0 55%; display:flex; flex-direction:column; gap:1.2mm; }
.f4-cta-primary { font-size:2.6mm; font-weight:700; color:#fff; line-height:1.15; letter-spacing:.01em; }
.f4-cta-sub     { font-size:1.9mm; color:rgba(212,168,48,.6); line-height:1.2; }
.f4-steps { display:flex; flex-direction:column; gap:.7mm; margin-top:.5mm; }
.f4-step  { font-size:1.7mm; color:rgba(212,168,48,.55); display:flex; align-items:center; gap:1mm; line-height:1; }
.f4-step::before { content:''; display:inline-block; width:1mm; height:1mm; border-radius:50%; background:#d4a830; opacity:.8; flex-shrink:0; }
.f4-footer-brand { display:flex; align-items:center; gap:1.2mm; margin-top:1.5mm; }
.f4-footer-logo  { height:3.5mm; width:auto; opacity:.6; }
.f4-solana { font-size:1.8mm; color:rgba(212,168,48,.5); font-weight:600; letter-spacing:.05em; }
.f4-qr-col { flex:1; display:flex; align-items:center; justify-content:center; }
.f4-qr-box { width:20mm; height:20mm; background:#fff; box-shadow:0 0 0 .6mm rgba(212,168,48,.6),0 0 5mm rgba(212,168,48,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.f4-qr-box img { width:18mm; height:18mm; display:block; }

/* S4 back */
.b4 {
  background-color:#090600;
  background-image:radial-gradient(ellipse at 50% 45%,rgba(212,168,48,.12) 0%,transparent 60%);
  display:flex; align-items:center; justify-content:center;
}
.b4-outer-frame { position:absolute; inset:2mm; border:.5mm solid rgba(212,168,48,.4); pointer-events:none; z-index:5; }
.b4-inner-frame { position:absolute; inset:3.5mm; border:.3mm solid rgba(212,168,48,.2); pointer-events:none; z-index:5; }
.b4-content { position:relative; z-index:6; display:flex; flex-direction:column; align-items:center; gap:1.5mm; }
.b4-emblem  { width:13mm; height:13mm; border-radius:50%; border:.7mm solid #d4a830; background:rgba(212,168,48,.08); box-shadow:0 0 4mm rgba(212,168,48,.35),inset 0 0 3mm rgba(212,168,48,.08); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.b4-emblem-icon { font-size:7mm; line-height:1; }
.b4-brand   { font-size:3.8mm; font-weight:900; color:#d4a830; letter-spacing:.08em; text-align:center; line-height:1; }
.b4-divider { width:20mm; height:.4mm; background:linear-gradient(90deg,transparent,#d4a830,transparent); }
.b4-date    { font-size:1.9mm; color:rgba(212,168,48,.55); letter-spacing:.14em; text-transform:uppercase; text-align:center; line-height:1; }
.b4-sub     { font-size:1.8mm; color:rgba(212,168,48,.35); letter-spacing:.1em; text-transform:uppercase; text-align:center; line-height:1; }
.b4-footer      { display:flex; align-items:center; gap:1.5mm; margin-top:.5mm; }
.b4-footer-logo { height:3.5mm; width:auto; filter:sepia(1) saturate(2) hue-rotate(5deg) brightness(.8); opacity:.7; }
.b4-solana { font-size:1.8mm; color:rgba(212,168,48,.45); font-weight:600; letter-spacing:.06em; }

/* ══════════════════════════════════════════════════════════
   S5: PARCHMENT — Diagonal Slash (dark left | cream right)
   ══════════════════════════════════════════════════════════ */
.f5 {
  background:linear-gradient(105deg,#1e3d0e 0%,#1e3d0e 44%,#a3e635 44%,#a3e635 46%,#ede0c8 46%,#ede0c8 100%);
}
.f5-left {
  position:absolute; left:0; top:0; bottom:0; width:46%;
  padding:2.8mm 1.5mm 2.5mm 3.5mm;
  display:flex; flex-direction:column; justify-content:space-between;
}
.f5-brand { display:flex; flex-direction:column; gap:.3mm; }
.f5-brand-line1 { display:flex; align-items:center; gap:1mm; color:#a3e635; font-size:3mm; font-weight:900; line-height:1.1; white-space:nowrap; }
.f5-icon        { font-size:4.5mm; line-height:1; }
.f5-brand-line2 { color:#a3e635; font-size:3mm; font-weight:900; line-height:1.1; padding-left:.5mm; }

  { num:'04', name:'Gold Edition', desc:'Framed premium · Left info / Right QR',        front:f4Front, back:f4Back },
  { num:'05', name:'Parchment',    desc:'Diagonal slash · Dark left / Cream right',     front:f5Front, back:f5Back },
  { num:'06', name:'Dual Panel',   desc:'Bold type left · Dark green / Cream split',    front:f6Front, back:f6Back },
];

let selectedStyle = null;

function buildCards(qrSrc) {
  const showcase    = document.getElementById('showcase');
  const printSheets = document.getElementById('print-sheets');

  STYLES.forEach((s, i) => {
    const idx = i + 1;

    /* Showcase pair */
    const opt = document.createElement('div');
    opt.className = 'style-option';
    opt.dataset.style = idx;
    opt.onclick = () => selectStyle(idx, s.name);
    opt.innerHTML = `
      <div class="card-pair">
        <div class="pair-side">
          <div class="pair-lbl">Front</div>
          ${s.front(qrSrc)}
        </div>
        <div class="pair-side">
          <div class="pair-lbl">Back</div>
          ${s.back()}
        </div>
      </div>
      <div class="style-meta">
        <div class="style-num">${s.num}</div>
        <div class="style-name">${s.name}</div>
        <div class="style-desc">${s.desc}</div>
      </div>`;
    showcase.appendChild(opt);

    /* Print pair: page 1 = 6 fronts, page 2 = 6 backs */
    const pair = document.createElement('div');
    pair.className = 'print-pair';
    pair.id = `pp-${idx}`;

    const frontSheet = document.createElement('div');
    frontSheet.className = 'print-sheet';
    for (let j = 0; j < 6; j++) frontSheet.innerHTML += s.front(qrSrc);

    const backSheet = document.createElement('div');
    backSheet.className = 'print-sheet';
    for (let j = 0; j < 6; j++) backSheet.innerHTML += s.back();

    pair.appendChild(frontSheet);
    pair.appendChild(backSheet);
    printSheets.appendChild(pair);
  });
}

/* ── QR generation ── */
const tmp = document.createElement('div');
Object.assign(tmp.style, {position:'fixed',left:'-9999px',top:'-9999px'});
document.body.appendChild(tmp);
new QRCode(tmp, {
  text: QR_URL, width:320, height:320,
  colorDark:'#0c1a0e', colorLight:'#ffffff',
  correctLevel: QRCode.CorrectLevel.M,
});
setTimeout(() => {
  const canvas = tmp.querySelector('canvas');
  const qrSrc  = canvas ? canvas.toDataURL() : '';
  document.body.removeChild(tmp);
  buildCards(qrSrc);
}, 150);

/* ── Selection & print ── */
function selectStyle(idx, name) {
  selectedStyle = idx;
  document.querySelectorAll('.style-option').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.style-option[data-style="${idx}"]`).classList.add('selected');
  document.getElementById('selection-label').textContent = `Selected: ${String(idx).padStart(2,'0')} — ${name}`;
  const btn = document.getElementById('btn-print');
  btn.classList.add('active');
  btn.textContent = `🖨️  Print Style ${String(idx).padStart(2,'0')}`;
}

function printSelected() {
  if (!selectedStyle) return;
  document.querySelectorAll('.print-pair').forEach(s => s.classList.remove('selected'));
  document.getElementById(`pp-${selectedStyle}`).classList.add('selected');
  window.print();
}
</script>
