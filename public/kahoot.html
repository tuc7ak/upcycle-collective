<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUC Quiz Challenge 🎯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c;
  --red-d:#a8102a; --blue-d:#0d4e9e; --yellow-d:#a07400; --green-d:#1a5e08;
}
body{
  font-family:'Nunito',sans-serif;
  background:#1a0a3a;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* ── Shared ── */
.screen{ display:none; width:100vw; height:100vh; flex-direction:column; align-items:center; justify-content:center; }
.screen.active{ display:flex; }

/* ── Intro ── */
#intro{
  background:linear-gradient(160deg,#1a0a3a,#0d1a4a);
  gap:22px; position:relative;
}
.intro-bg{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.intro-logo{ font-size:80px; filter:drop-shadow(0 0 30px rgba(200,100,255,0.8)); }
.intro-title{ font-size:60px; font-weight:900; color:#fff; text-align:center;
  text-shadow:0 0 30px rgba(160,80,255,0.7); }
.intro-sub{ font-size:20px; color:rgba(255,255,255,0.5); letter-spacing:0.1em; }
.intro-badge{
  background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.15);
  border-radius:999px; padding:8px 24px; font-size:15px; color:rgba(255,255,255,0.6);
}
#btn-start{
  padding:20px 72px; font-size:26px; font-weight:900; font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#cc44ff,#8811dd); color:#fff; border:none;
  border-radius:999px; cursor:pointer;
  box-shadow:0 6px 0 #550088, 0 0 40px rgba(200,80,255,0.5);
  transition:transform .12s, box-shadow .12s; margin-top:12px;
}
#btn-start:hover{ transform:translateY(-3px); box-shadow:0 9px 0 #550088, 0 0 50px rgba(200,80,255,0.7); }
#btn-start:active{ transform:translateY(3px); box-shadow:0 3px 0 #550088; }
.intro-back{ font-size:14px; color:rgba(255,255,255,0.3); cursor:pointer; text-decoration:underline; }
.intro-back:hover{ color:rgba(255,255,255,0.6); }

/* ── Game screen ── */
#game{
  background:#1a0a3a;
  padding:0; justify-content:flex-start;
}

/* Timer + progress bar */
#top-bar{
  width:100%; padding:14px 32px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  background:rgba(0,0,0,0.4);
}
#progress-text{ color:rgba(255,255,255,0.6); font-size:15px; font-weight:700; white-space:nowrap; }
#timer-wrap{ flex:1; position:relative; height:20px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden; }
#timer-bar{
  height:100%; border-radius:99px; transition:width .9s linear, background .5s;
  background:linear-gradient(90deg,#44ff88,#00cc44);
}
#timer-num{ color:#fff; font-size:22px; font-weight:900; min-width:40px; text-align:right; }
#score-display{ color:#ffdd00; font-size:18px; font-weight:900; white-space:nowrap; }

/* Streak */
#streak-badge{
  display:none; position:fixed; top:80px; right:32px; z-index:20;
  background:linear-gradient(135deg,#ff8800,#ffdd00); color:#1a0600;
  font-size:18px; font-weight:900; padding:10px 20px; border-radius:999px;
  box-shadow:0 0 24px rgba(255,180,0,0.6);
  animation:streakPop .4s cubic-bezier(.36,1.6,.54,1);
}
@keyframes streakPop{ from{transform:scale(0.5) rotate(-10deg)} to{transform:scale(1) rotate(0)} }

/* Question card */
#question-card{
  width:100%; flex:0 0 auto;
  background:linear-gradient(180deg,#2a1060,#1a0a3a);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 48px; gap:10px;
  min-height:200px;
  border-bottom:3px solid rgba(255,255,255,0.08);
}
#q-number{ font-size:13px; color:rgba(255,255,255,0.4); letter-spacing:0.15em; font-weight:700; }
#q-text{
  font-size:clamp(20px,2.8vw,36px); font-weight:900; color:#fff; text-align:center;
  line-height:1.3; max-width:900px;
}

/* Answers grid */
#answers-grid{
  display:grid; grid-template-columns:1fr 1fr;
  gap:16px; padding:24px 32px;
  width:100%; flex:1;
}
.ans-btn{
  display:flex; align-items:center; gap:18px;
  padding:20px 28px; border:none; border-radius:16px;
  font-family:'Nunito',sans-serif; font-size:clamp(16px,1.8vw,22px);
  font-weight:800; color:#fff; cursor:pointer; text-align:left;
  transition:transform .1s, filter .1s, box-shadow .1s;
  border-bottom:6px solid transparent;
}
.ans-btn:hover{ transform:scale(1.02); filter:brightness(1.1); }
.ans-btn:active{ transform:scale(0.97); }
.ans-btn:disabled{ cursor:default; }

.ans-icon{ font-size:28px; flex-shrink:0; }

.ans-btn.a{ background:var(--red);   border-color:var(--red-d);    box-shadow:0 6px 0 var(--red-d);    }
.ans-btn.b{ background:var(--blue);  border-color:var(--blue-d);   box-shadow:0 6px 0 var(--blue-d);   }
.ans-btn.c{ background:var(--yellow);border-color:var(--yellow-d); box-shadow:0 6px 0 var(--yellow-d); }
.ans-btn.d{ background:var(--green); border-color:var(--green-d);  box-shadow:0 6px 0 var(--green-d);  }

.ans-btn.correct{ filter:brightness(1.25); box-shadow:0 0 30px rgba(255,255,255,0.4)!important; }
.ans-btn.wrong  { filter:brightness(0.35) saturate(0.3); box-shadow:none!important; }
.ans-btn.pulse  { animation:correctPulse .5s ease; }
@keyframes correctPulse{ 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }

/* ── Feedback screen ── */
#feedback{
  background:linear-gradient(160deg,#1a0a3a,#0d1a4a);
  gap:20px;
}
.fb-result{ font-size:72px; }
.fb-verdict{ font-size:44px; font-weight:900; }
.fb-verdict.correct-v{ color:#44ff88; text-shadow:0 0 24px rgba(0,255,120,0.6); }
.fb-verdict.wrong-v  { color:#ff4444; text-shadow:0 0 24px rgba(255,60,60,0.6); }
.fb-pts{ font-size:32px; color:#ffdd00; font-weight:800; }
.fb-fact{
  max-width:700px; text-align:center; font-size:18px; color:rgba(255,255,255,0.7);
  line-height:1.6; padding:20px 32px;
  background:rgba(255,255,255,0.07); border-radius:16px;
  border:1px solid rgba(255,255,255,0.12);
}
.fb-fact strong{ color:#a3e635; }
.fb-next{
  padding:14px 52px; font-size:20px; font-weight:900; font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#44aaff,#1155dd); color:#fff; border:none;
  border-radius:999px; cursor:pointer;
  box-shadow:0 5px 0 #003388, 0 0 24px rgba(80,150,255,0.4);
}
.fb-next:hover{ transform:translateY(-2px); }
.fb-next:active{ transform:translateY(2px); }

/* ── Results ── */
#results{
  background:linear-gradient(160deg,#1a0a3a,#0d1a4a);
  gap:24px;
}
.rs-trophy{ font-size:90px; filter:drop-shadow(0 0 30px rgba(255,215,0,0.8)); }
.rs-title{ font-size:48px; font-weight:900; color:#fff; }
.rs-grade{ font-size:36px; font-weight:900; color:#ffdd00; text-shadow:0 0 20px rgba(255,200,0,0.6); }
.rs-score{ font-size:64px; font-weight:900; color:#a3e635; text-shadow:0 0 24px rgba(163,230,53,0.5); }
.rs-sub{ font-size:18px; color:rgba(255,255,255,0.45); }
.rs-btns{ display:flex; gap:16px; margin-top:8px; }
#btn-again{
  padding:14px 44px; font-size:20px; font-weight:900; font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#cc44ff,#8811dd); color:#fff; border:none;
  border-radius:999px; cursor:pointer; box-shadow:0 5px 0 #550088;
}
#btn-menu2{
  padding:14px 44px; font-size:20px; font-weight:900; font-family:'Nunito',sans-serif;
  background:rgba(255,255,255,0.1); color:#fff; border:2px solid rgba(255,255,255,0.25);
  border-radius:999px; cursor:pointer;
}
#btn-again:active,#btn-menu2:active{ transform:translateY(2px); }
</style>
</head>
<body>

<!-- INTRO -->
<div class="screen active" id="intro">
  <div class="intro-bg" id="intro-bg"></div>
  <div class="intro-logo">♻️</div>
  <div class="intro-title">TUC Quiz<br>Challenge</div>
  <div class="intro-sub">HOW WELL DO YOU KNOW RECYCLING?</div>
  <div class="intro-badge">12 Questions · Upcycle &amp; Sustainability</div>
  <button id="btn-start">▶&nbsp; START QUIZ</button>
  <a class="intro-back" href="game.html">← Back to Menu</a>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div id="top-bar">
    <div id="progress-text">Q 1 / 12</div>
    <div id="timer-wrap"><div id="timer-bar" style="width:100%"></div></div>
    <div id="timer-num">20</div>
    <div id="score-display">0 pts</div>
  </div>
  <div id="streak-badge" id="streak-badge">🔥 STREAK x2!</div>
  <div id="question-card">
    <div id="q-number">QUESTION 1</div>
    <div id="q-text">Loading...</div>
  </div>
  <div id="answers-grid">
    <button class="ans-btn a" data-idx="0"><span class="ans-icon">△</span><span class="ans-text"></span></button>
    <button class="ans-btn b" data-idx="1"><span class="ans-icon">◆</span><span class="ans-text"></span></button>
    <button class="ans-btn c" data-idx="2"><span class="ans-icon">●</span><span class="ans-text"></span></button>
    <button class="ans-btn d" data-idx="3"><span class="ans-icon">■</span><span class="ans-text"></span></button>
  </div>
</div>

<!-- FEEDBACK -->
<div class="screen" id="feedback">
  <div class="fb-result" id="fb-result">✅</div>
  <div class="fb-verdict" id="fb-verdict">Correct!</div>
  <div class="fb-pts" id="fb-pts">+950 pts</div>
  <div class="fb-fact" id="fb-fact"></div>
  <button class="fb-next" id="btn-next">Next Question →</button>
</div>

<!-- RESULTS -->
<div class="screen" id="results">
  <div class="rs-trophy" id="rs-trophy">🏆</div>
  <div class="rs-title">Quiz Complete!</div>
  <div class="rs-grade" id="rs-grade">Eco Champion!</div>
  <div class="rs-score" id="rs-score">0 pts</div>
  <div class="rs-sub" id="rs-sub">You got 0 / 12 correct</div>
  <div class="rs-btns">
    <button id="btn-again">↺ Play Again</button>
    <button id="btn-menu2">🏠 Back to Menu</button>
  </div>
</div>

<script>
'use strict';

// ── Questions ───────────────────────────────────────────────
const QUESTIONS = [
  {
    q: "What does 'upcycling' mean?",
    a: ["Throwing old items away", "Turning waste into something MORE valuable", "The same as normal recycling", "Buying secondhand clothes"],
    correct: 1,
    fact: "<strong>Upcycling</strong> goes beyond recycling — it creatively transforms waste into products of higher quality or value. Turning old tyres into a garden planter is upcycling! ♻️"
  },
  {
    q: "Which of these is the BEST example of upcycling?",
    a: ["Putting a glass bottle in the recycling bin", "Throwing away an old shirt", "Turning old jeans into a stylish tote bag", "Buying a brand-new backpack"],
    correct: 2,
    fact: "Converting <strong>old jeans into a bag</strong> is classic upcycling — the item becomes something new and useful without going through an industrial recycling process. 👖➡️👜"
  },
  {
    q: "How long does a plastic bottle take to decompose in nature?",
    a: ["About 10 years", "About 50 years", "About 450 years", "About 10,000 years"],
    correct: 2,
    fact: "A single plastic bottle can take <strong>up to 450 years</strong> to break down — that means a bottle thrown away today will still be around in the year 2470! 😱"
  },
  {
    q: "What are the '3 R's' of sustainability?",
    a: ["Reuse, Recycle, Rebuild", "Reduce, Reuse, Recycle", "Repair, Recover, Restore", "Renew, Reduce, Replace"],
    correct: 1,
    fact: "<strong>Reduce, Reuse, Recycle</strong> — and the order matters! Reducing consumption is the most powerful first step, before reusing or recycling. 🌱"
  },
  {
    q: "Which material takes the LONGEST to decompose?",
    a: ["Aluminium can (80 years)", "Banana peel (6 weeks)", "Cotton shirt (5 months)", "Glass bottle (1 million+ years)"],
    correct: 3,
    fact: "<strong>Glass</strong> can take over a million years to decompose naturally. The good news? It can be recycled endlessly without losing purity! 🍾"
  },
  {
    q: "Recycling one aluminium can saves enough energy to power what?",
    a: ["A phone for 15 minutes", "A TV for 3 hours", "A light bulb for 10 seconds", "A microwave for 30 seconds"],
    correct: 1,
    fact: "Recycling a single aluminium can saves enough energy to power a <strong>TV for 3 hours!</strong> Aluminium can be recycled infinitely with 95% energy savings. 📺⚡"
  },
  {
    q: "What is 'fast fashion' known for causing?",
    a: ["Faster clothing production for athletes", "Massive textile waste and pollution", "Cheaper clothes that last longer", "Supporting local artisans"],
    correct: 1,
    fact: "<strong>Fast fashion</strong> is one of the world's largest polluters. The industry produces 10% of global carbon emissions and 85% of textiles end up in landfill each year. 👗🗑️"
  },
  {
    q: "Which item should NOT go in your recycling bin?",
    a: ["Clean cardboard box", "Empty aluminium can", "Greasy pizza box", "Glass jar"],
    correct: 2,
    fact: "A <strong>greasy pizza box</strong> contaminates recycling because oil and grease cannot be separated from paper fibres during recycling. Tear off the clean top and recycle that instead! 🍕"
  },
  {
    q: "What percentage of global fashion ends up in landfill each year?",
    a: ["About 15%", "About 35%", "About 57%", "About 85%"],
    correct: 3,
    fact: "A shocking <strong>85% of textiles</strong> end up in landfill or are incinerated annually. That's the equivalent of one garbage truck of clothes every second. 😢"
  },
  {
    q: "What is a 'circular economy'?",
    a: ["An economy where all businesses are circular shaped", "A system where products are reused, repaired and recycled indefinitely", "Buying and selling only round objects", "A government tax on waste"],
    correct: 1,
    fact: "A <strong>circular economy</strong> keeps materials in use for as long as possible — design products to last, repair when broken, and recycle at end of life. Zero waste is the goal! 🔄"
  },
  {
    q: "The Upcycle Collective gives you TUC tokens for...",
    a: ["Buying new items at the event", "Donating items to be upcycled", "Winning the Bomberman game", "Taking photos at the event"],
    correct: 1,
    fact: "<strong>TUC tokens</strong> are earned by donating items at The Upcycle Collective! You can then spend them at vendor stations — real value for your contribution to the planet. 🪙♻️"
  },
  {
    q: "Which action has the BIGGEST positive impact on the environment?",
    a: ["Recycling your waste", "Buying organic products", "Reducing what you consume in the first place", "Using paper bags instead of plastic"],
    correct: 2,
    fact: "<strong>Reducing consumption</strong> has the highest impact — it means less energy, less manufacturing, less packaging, and less waste from the very start. 'Reduce' leads the 3 R's for a reason! 🌍"
  },
];

const ANSWER_TIME = 20; // seconds

let currentQ = 0;
let score = 0;
let streak = 0;
let correctCount = 0;
let timerInterval = null;
let timeLeft = ANSWER_TIME;
let answered = false;

// ── Screens ─────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Starfield ───────────────────────────────────────────────
(function() {
  const bg = document.getElementById('intro-bg');
  for (let i=0;i<100;i++) {
    const s = document.createElement('div');
    const sz = 1+Math.random()*2.5;
    Object.assign(s.style, {
      position:'absolute', width:sz+'px', height:sz+'px', borderRadius:'50%',
      background:'rgba(255,255,255,'+(0.2+Math.random()*0.8)+')',
      left:Math.random()*100+'%', top:Math.random()*100+'%',
      animation:`tw ${2+Math.random()*3}s ${Math.random()*3}s infinite alternate`,
    });
    bg.appendChild(s);
  }
  const st = document.createElement('style');
  st.textContent = '@keyframes tw{from{opacity:0.1}to{opacity:1}}';
  document.head.appendChild(st);
})();

// ── Timer ───────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = ANSWER_TIME;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  const pct = timeLeft / ANSWER_TIME * 100;
  const bar = document.getElementById('timer-bar');
  bar.style.width = pct + '%';
  if (pct > 50)      bar.style.background = 'linear-gradient(90deg,#44ff88,#00cc44)';
  else if (pct > 25) bar.style.background = 'linear-gradient(90deg,#ffdd00,#ff8800)';
  else               bar.style.background = 'linear-gradient(90deg,#ff4444,#cc0000)';
  document.getElementById('timer-num').textContent = timeLeft;
}

function timeUp() {
  answered = true;
  streak = 0;
  disableAnswers();
  revealAnswer();
  showFeedback(false, 0);
}

// ── Load question ───────────────────────────────────────────
function loadQuestion(idx) {
  answered = false;
  const q = QUESTIONS[idx];
  document.getElementById('q-number').textContent = `QUESTION ${idx+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress-text').textContent = `Q ${idx+1} / ${QUESTIONS.length}`;
  document.getElementById('score-display').textContent = score.toLocaleString() + ' pts';

  const btns = document.querySelectorAll('.ans-btn');
  btns.forEach((btn, i) => {
    btn.querySelector('.ans-text').textContent = q.a[i];
    btn.classList.remove('correct','wrong','pulse');
    btn.disabled = false;
    btn.style.opacity = '1';
  });

  document.getElementById('streak-badge').style.display = 'none';
  startTimer();
}

// ── Answer handling ─────────────────────────────────────────
function disableAnswers() {
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
}

function revealAnswer() {
  const correct = QUESTIONS[currentQ].correct;
  document.querySelectorAll('.ans-btn').forEach((btn, i) => {
    if (i === correct) btn.classList.add('correct','pulse');
    else               btn.classList.add('wrong');
  });
}

document.querySelectorAll('.ans-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const chosen  = parseInt(btn.dataset.idx);
    const correct = QUESTIONS[currentQ].correct;
    const isRight = chosen === correct;

    revealAnswer();
    disableAnswers();

    if (isRight) {
      streak++;
      correctCount++;
      const speedBonus = Math.ceil((timeLeft / ANSWER_TIME) * 900) + 100;
      const streakBonus = streak >= 3 ? Math.floor(speedBonus * 0.25) : 0;
      const earned = speedBonus + streakBonus;
      score += earned;

      if (streak >= 2) {
        const sb = document.getElementById('streak-badge');
        sb.textContent = `🔥 STREAK x${streak}!`;
        sb.style.display = 'block';
      }
      setTimeout(() => showFeedback(true, speedBonus + streakBonus), 700);
    } else {
      streak = 0;
      setTimeout(() => showFeedback(false, 0), 700);
    }
  });
});

function showFeedback(isCorrect, pts) {
  document.getElementById('fb-result').textContent  = isCorrect ? '✅' : '❌';
  const verdict = document.getElementById('fb-verdict');
  verdict.textContent = isCorrect ? (timeLeft <= 0 ? "Time's up! But..." : 'Correct! 🎉') : "Wrong!";
  verdict.className   = 'fb-verdict ' + (isCorrect ? 'correct-v' : 'wrong-v');
  document.getElementById('fb-pts').textContent     = isCorrect ? `+${pts.toLocaleString()} pts` : 'No points this round';
  document.getElementById('fb-fact').innerHTML      = QUESTIONS[currentQ].fact;

  const isLast = currentQ >= QUESTIONS.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? 'See Results 🏆' : 'Next Question →';

  show('feedback');
}

document.getElementById('btn-next').addEventListener('click', () => {
  currentQ++;
  if (currentQ >= QUESTIONS.length) {
    showResults();
  } else {
    show('game');
    loadQuestion(currentQ);
  }
});

// ── Results ─────────────────────────────────────────────────
function showResults() {
  const pct = correctCount / QUESTIONS.length;
  let trophy, grade;
  if (pct >= 0.92)     { trophy='🏆'; grade='Eco Legend! Incredible!'; }
  else if (pct >= 0.75){ trophy='🥇'; grade='Eco Champion! Amazing!'; }
  else if (pct >= 0.58){ trophy='🥈'; grade='Green Warrior! Great job!'; }
  else if (pct >= 0.42){ trophy='🌱'; grade='Eco Learner — keep going!'; }
  else                 { trophy='♻️'; grade='Every journey starts here!'; }

  document.getElementById('rs-trophy').textContent = trophy;
  document.getElementById('rs-grade').textContent  = grade;
  document.getElementById('rs-score').textContent  = score.toLocaleString() + ' pts';
  document.getElementById('rs-sub').textContent    = `You got ${correctCount} / ${QUESTIONS.length} correct`;
  show('results');
}

// ── Buttons ─────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  currentQ=0; score=0; streak=0; correctCount=0;
  show('game');
  loadQuestion(0);
});

document.getElementById('btn-again').addEventListener('click', () => {
  currentQ=0; score=0; streak=0; correctCount=0;
  show('game');
  loadQuestion(0);
});

document.getElementById('btn-menu2').addEventListener('click', () => {
  window.location.href = 'game.html';
});
</script>
</body>
</html>
