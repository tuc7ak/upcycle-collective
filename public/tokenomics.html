<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUC — Tokenomics</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f4c2a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 64px;
    }

    .logo { font-size: 36px; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 2px; text-align: center; }
    .subtitle { font-size: 13px; opacity: 0.5; margin-bottom: 32px; text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }

    .token-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 24px;
    }

    .token-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .token-name { font-size: 20px; font-weight: 900; }
    .token-pilot {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      opacity: 0.5; background: rgba(255,255,255,0.1); border-radius: 999px; padding: 4px 10px;
    }

    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat-box { background: rgba(0,0,0,0.2); border-radius: 14px; padding: 16px; text-align: center; }
    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 900; color: #7fff7f; line-height: 1; }

    .mint-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(0,0,0,0.2); border-radius: 12px; padding: 12px 14px;
    }
    .mint-addr { font-size: 11px; font-family: monospace; opacity: 0.7; word-break: break-all; }
    .mint-link { color: #7fff7f; font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; opacity: 0.85; flex-shrink: 0; }
    .mint-link:hover { opacity: 1; }

    .error-bar {
      display: none;
      background: rgba(244,67,54,0.15); border: 1px solid rgba(244,67,54,0.4);
      border-radius: 10px; color: #fff; font-size: 13px; padding: 12px 16px;
      text-align: center; width: 100%; max-width: 720px; margin-bottom: 16px;
    }
    .error-bar.active { display: block; }

    .footer-row { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
    .refresh-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; color: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
      padding: 7px 14px; transition: background 0.15s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.18); }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }
    .updated-badge { font-size: 11px; opacity: 0.38; }
  </style>
</head>
<body>

<!-- PIN GATE -->
<div id="pin-gate" style="position:fixed;inset:0;background:#0f4c2a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;">
  <div style="font-size:36px">🔒</div>
  <div style="font-size:20px;font-weight:800;color:#fff">Staff Access</div>
  <div style="font-size:13px;opacity:0.5;color:#fff;margin-bottom:4px">Enter PIN to continue</div>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="10" placeholder="PIN" autocomplete="off"
    style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:12px;color:#fff;font-size:24px;letter-spacing:0.3em;padding:14px 20px;text-align:center;outline:none;width:220px;"
    onkeydown="if(event.key==='Enter')checkPin()" />
  <button onclick="checkPin()" style="background:#4caf50;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;padding:14px 0;cursor:pointer;width:220px;">Unlock</button>
  <div id="pin-error" style="color:#ff8a65;font-size:13px;display:none">Incorrect PIN</div>
</div>
<script>
  (function(){
    if(sessionStorage.getItem('tuc_pin')==='1990') document.getElementById('pin-gate').style.display='none';
    else setTimeout(()=>document.getElementById('pin-input')?.focus(),100);
  })();
  function checkPin(){
    if(document.getElementById('pin-input').value==='1990'){
      sessionStorage.setItem('tuc_pin','1990');
      document.getElementById('pin-gate').style.display='none';
    } else {
      document.getElementById('pin-error').style.display='block';
      document.getElementById('pin-input').value='';
    }
  }
</script>

  <div class="logo">♻️</div>
  <h1>TUC Tokenomics</h1>
  <p class="subtitle">Live on-chain data · Solana Mainnet</p>

  <div class="error-bar" id="error-bar"></div>

  <div class="grid" id="grid">
    <div class="token-card">
      <div class="token-header"><div class="token-name">TUC</div><div class="token-pilot">Pilot Token 1</div></div>
      <div class="loading-state" style="opacity:.4;padding:20px 0;text-align:center;">Loading…</div>
    </div>
    <div class="token-card">
      <div class="token-header"><div class="token-name">wTUC</div><div class="token-pilot">Pilot Token 2</div></div>
      <div class="loading-state" style="opacity:.4;padding:20px 0;text-align:center;">Loading…</div>
    </div>
  </div>

  <div class="footer-row">
    <div class="updated-badge" id="updated-badge"></div>
    <button class="refresh-btn" id="refresh-btn" onclick="load()">↻ Refresh</button>
  </div>

  <script>
    const BASE_URL = 'https://upcycle-collective.vercel.app';

    function tokenCardHTML(name, pilotLabel, data) {
      const short = data.mint.slice(0, 8) + '…' + data.mint.slice(-8);
      return `
        <div class="token-header"><div class="token-name">${name}</div><div class="token-pilot">${pilotLabel}</div></div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-label">Total Minted</div>
            <div class="stat-value">${data.totalSupply.toLocaleString()}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Holders</div>
            <div class="stat-value">${data.holders.toLocaleString()}</div>
          </div>
        </div>
        <div class="mint-row">
          <div class="mint-addr">${short}</div>
          <a class="mint-link" href="https://solscan.io/token/${data.mint}" target="_blank" rel="noopener">Solscan ↗</a>
        </div>
      `;
    }

    async function load() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Loading…';

      try {
        const r    = await fetch(`${BASE_URL}/api/tokenomics`);
        const data = await r.json();

        if (data.error) { showError(data.error); return; }
        hideError();

        const cards = document.getElementById('grid').children;
        cards[0].innerHTML = tokenCardHTML('TUC', 'Pilot Token 1', data.tuc);
        cards[1].innerHTML = tokenCardHTML('wTUC', 'Pilot Token 2', data.wtuc);

        const now = new Date();
        document.getElementById('updated-badge').textContent =
          `Updated ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      } catch (e) {
        showError('Failed to load data: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '↻ Refresh';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-bar');
      el.textContent = msg;
      el.classList.add('active');
    }
    function hideError() {
      document.getElementById('error-bar').classList.remove('active');
    }

    load();
  </script>

</body>
</html>
